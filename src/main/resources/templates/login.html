<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Login')}"></head>
<body class="login-page">
<main class="login-wrapper">
  <header class="login-intro">
    <a th:replace="~{fragments/brand :: brandLink('login-brand')}"></a>

    <div class="login-header">
      <h1>
        <i class="bi bi-box-arrow-in-right" aria-hidden="true"></i>
        <span>Acceso</span>
      </h1>
      <p>Inicia sesión para continuar en SgOVI.</p>
    </div>
  </header>

  <section class="login-card">
    <form class="login-form" action="#" th:action="@{/login}" th:object="${user}" method="post">
      <div class="mb-3">
        <label for="email" class="form-label">Correo electrónico</label>
        <input id="email" class="form-control" type="email" th:field="*{email}"/>
        <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="error"></div>
      </div>

      <div class="mb-4">
        <label for="password" class="form-label">Contraseña</label>
        <input id="password" class="form-control" type="password" th:field="*{password}"/>
        <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="error"></div>
      </div>

      <button type="submit" class="btn btn-primary w-100">Iniciar sesión</button>
    </form>

    <p class="login-links mt-4 mb-0">
      <a th:href="@{/ovi-users/register}" href="/ovi-users/register">Alta OVI</a>
      <span aria-hidden="true"> · </span>
      <a th:href="@{/pap-patis/register}" href="/pap-patis/register">Alta PAP/PATI</a>
    </p>
  </section>
</main>
<script th:src="@{/js/sgovi.js}" src="/js/sgovi.js"></script>
</body>
</html>
