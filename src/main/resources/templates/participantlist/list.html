<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Listas de Participantes - SgOVI')}"></head>
<body>
<nav th:replace="~{fragments/topbar :: topbar}"></nav>
<header th:replace="~{fragments/page-header :: pageHeader(title='Listado de Listas de Participantes', icon='bi-list-check', subtitle='')}"></header>

<main class="container page-content mb-5">
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill"></i>
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>

    <div class="action-bar">
        <a href="/participant-lists/add" class="action-link btn-primary-custom"><i class="bi bi-plus-circle"></i> Agregar Participante</a>
    </div>
    <div th:replace="~{fragments/table-tools :: tableTools}" th:if="${tableAction != null}"></div>


    <div class="table-responsive sgovi-table-shell">
    <table class="table table-hover">
        <thead>
            <tr>
                <th><i class="bi bi-hash"></i> ID</th>
                <th><i class="bi bi-check2"></i> Asistencia</th>
                <th><i class="bi bi-certificate"></i> Certificado</th>
                <th><i class="bi bi-calendar-event"></i> Actividad</th>
                <th><i class="bi bi-person"></i> Participante</th>
                <th><i class="bi bi-tools"></i> Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="pl : ${participantLists}"
                th:with="act=${@nameMaps.activityById(pl.idActivity)}">
                <td th:text="${pl.idParticipantList}"></td>
                <td><span class="badge" th:classappend="${pl.attendance ? 'bg-success' : 'bg-danger'}" th:text="${pl.attendance ? 'Sí' : 'No'}"></span></td>
                <td>
                    <a th:href="${pl.attendanceCertificateUrl}" target="_blank" th:if="${pl.attendanceCertificateUrl != null}" class="action-btn btn-edit"><i class="bi bi-download"></i> Ver</a>
                    <span th:if="${pl.attendanceCertificateUrl == null}" class="text-muted">—</span>
                </td>
                <td>
                    <span th:text="${act != null ? act.name : '—'}">Actividad</span>
                    <div class="text-muted small" th:if="${act != null}" th:text="${act.date}"></div>
                </td>
                <td th:text="${pl.idOviUser != null ? @nameMaps.oviUserNameById(pl.idOviUser) : @nameMaps.papPatiNameById(pl.idPapPati)}">Participante</td>
                <td>
                    <a th:href="@{/participant-lists/edit/{id}(id=${pl.idParticipantList})}" class="action-btn btn-edit"><i class="bi bi-pencil"></i> Editar</a>
                    <a th:href="@{/participant-lists/delete/{id}(id=${pl.idParticipantList})}" class="action-btn btn-delete"><i class="bi bi-trash"></i> Eliminar</a>
                </td>
            </tr>
        </tbody>
    </table>
    </div>
</main>
</body>
</html>
