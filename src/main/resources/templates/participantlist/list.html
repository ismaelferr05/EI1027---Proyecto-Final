<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Listas de Participantes - SgOVI')}"></head>
<body>
<nav th:replace="~{fragments/topbar :: topbar}"></nav>
<header th:replace="~{fragments/page-header :: pageHeader(title='Listado de Listas de Participantes', icon='bi-list-check', subtitle='')}"></header>

<main class="container page-content mb-5">
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill"></i>
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>

    <div class="action-bar">
        <a href="/dashboard" class="action-link btn-outline-custom"><i class="bi bi-house"></i> Volver al dashboard</a>
        <a href="/participant-lists/add" class="action-link btn-primary-custom"><i class="bi bi-plus-circle"></i> Agregar Participante</a>
    </div>

    <div class="table-responsive sgovi-table-shell">
    <table class="table table-hover">
        <thead>
            <tr>
                <th><i class="bi bi-hash"></i> ID</th>
                <th><i class="bi bi-check2"></i> Asistencia</th>
                <th><i class="bi bi-certificate"></i> Certificado</th>
                <th><i class="bi bi-calendar-event"></i> ID Actividad</th>
                <th><i class="bi bi-person"></i> ID Usuario OVI</th>
                <th><i class="bi bi-person-arms-up"></i> ID PAP PATI</th>
                <th><i class="bi bi-tools"></i> Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="participantList : ${participantLists}">
                <td th:text="${participantList.idParticipantList}"></td>
                <td><span class="badge" th:classappend="${participantList.attendance ? 'bg-success' : 'bg-danger'}" th:text="${participantList.attendance ? 'Sí' : 'No'}"></span></td>
                <td><a th:href="${participantList.attendanceCertificateUrl}" target="_blank" th:if="${participantList.attendanceCertificateUrl != null}" class="action-btn btn-edit"><i class="bi bi-download"></i> Ver</a></td>
                <td th:text="${participantList.idActivity}"></td>
                <td th:text="${participantList.idOviUser}"></td>
                <td th:text="${participantList.idPapPati}"></td>
                <td>
                    <a th:href="@{/participant-lists/edit/{id}(id=${participantList.idParticipantList})}" class="action-btn btn-edit"><i class="bi bi-pencil"></i> Editar</a>
                    <a th:href="@{/participant-lists/delete/{id}(id=${participantList.idParticipantList})}" class="action-btn btn-delete" onclick="return confirm('¿Confirmar eliminación?')"><i class="bi bi-trash"></i> Eliminar</a>
                </td>
            </tr>
        </tbody>
    </table>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/sgovi.js}" src="/js/sgovi.js"></script>
</body>
</html>
