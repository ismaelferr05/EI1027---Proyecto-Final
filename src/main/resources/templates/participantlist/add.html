<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Crear participante')}"></head>
<body>
<nav th:replace="~{fragments/topbar :: topbar}"></nav>
<header th:replace="~{fragments/page-header :: pageHeader(title='Nuevo Participante', icon='bi-plus-circle', subtitle='')}"></header>

<main class="container page-content mb-5">
    
    <div th:replace="~{fragments/action-bar :: dashboardBackBar}"></div>

    <div class="form-section">
        <form class="form-horizontal" th:action="@{/participant-lists/add}" th:object="${participantList}" method="post">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="idActivity" class="form-label">Actividad:</label>
                    <select id="idActivity" th:field="*{idActivity}" class="form-select">
                        <option value="">Selecciona una actividad</option>
                        <option th:each="activity : ${activities}" th:value="${activity.idActivity}" th:text="${activity.name}"></option>
                    </select>
                    <div th:if="${#fields.hasErrors('idActivity')}" th:errors="*{idActivity}" class="text-danger small mt-2"></div>
                </div>

                <div class="col-md-6 mb-3">
                    <div class="form-check mt-4">
                        <input id="attendance" type="checkbox" th:field="*{attendance}" class="form-check-input">
                        <label for="attendance" class="form-check-label">Asistió a la actividad</label>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="idOviUser" class="form-label">Usuario OVI:</label>
                    <select id="idOviUser" th:field="*{idOviUser}" class="form-select">
                        <option value="">Selecciona un usuario OVI</option>
                        <option th:each="oviUser : ${oviUsers}" th:value="${oviUser.idOviUser}" th:text="|${oviUser.name} ${oviUser.lastName}|"></option>
                    </select>
                    <div th:if="${#fields.hasErrors('idOviUser')}" th:errors="*{idOviUser}" class="text-danger small mt-2"></div>
                </div>

                <div class="col-md-6 mb-3">
                    <label for="idPapPati" class="form-label">PAP PATI:</label>
                    <select id="idPapPati" th:field="*{idPapPati}" class="form-select">
                        <option value="">Selecciona un PAP PATI</option>
                        <option th:each="papPati : ${papPatis}" th:value="${papPati.idPapPati}" th:text="|${papPati.name} ${papPati.lastName}|"></option>
                    </select>
                    <div th:if="${#fields.hasErrors('idPapPati')}" th:errors="*{idPapPati}" class="text-danger small mt-2"></div>
                </div>
            </div>

            <div class="mb-3">
                <label for="attendanceCertificateUrl" class="form-label">URL Certificado de Asistencia:</label>
                <input id="attendanceCertificateUrl" type="url" th:field="*{attendanceCertificateUrl}" class="form-control" maxlength="255" placeholder="https://ejemplo.com/certificado.pdf">
                <div th:if="${#fields.hasErrors('attendanceCertificateUrl')}" th:errors="*{attendanceCertificateUrl}" class="text-danger small mt-2"></div>
            </div>

            <div class="btn-group-custom">
                <button type="submit" class="btn btn-primary"><i class="bi bi-check-circle"></i> Guardar Participante</button>
                <a href="/participant-lists/list" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Volver</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
