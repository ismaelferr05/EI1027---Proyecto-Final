<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Nueva Solicitud de Asistencia')}"></head>
<body>
<nav th:replace="~{fragments/topbar :: topbar}"></nav>
<header th:replace="~{fragments/page-header :: pageHeader(title='Nueva Solicitud de Asistencia Personal', icon='bi-file-text', subtitle='')}"></header>

<main class="container page-content mb-5">
    <form th:action="@{/requests/frontoffice/add}" th:object="${request}" method="post">
        <input type="hidden" th:field="*{status}" />
        <input type="hidden" th:field="*{idOviUser}" />

        <!-- Sección: Información Principal -->
        <div class="form-section">
            <h2><i class="bi bi-info-circle" aria-hidden="true"></i> Información Principal *</h2>
            <div class="mb-3">
                <label for="description" class="form-label">Descripción de necesidades</label>
                <textarea id="description" th:field="*{description}" class="form-control" rows="5" placeholder="Describe las necesidades de asistencia que requieres..." required></textarea>
                <div th:if="${#fields.hasErrors('description')}" th:errors="*{description}" class="text-danger small mt-2"></div>
            </div>
        </div>

        <!-- Sección: Fechas -->
        <div class="form-section">
            <h2><i class="bi bi-calendar-event" aria-hidden="true"></i> Período de Asistencia *</h2>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="availabilityDate" class="form-label">Fecha de disponibilidad *</label>
                    <input id="availabilityDate" type="date" th:field="*{availabilityDate}" th:attr="min=${today}" class="form-control" required>
                    <div class="form-text">Desde cuándo necesitas que empiece la asistencia.</div>
                    <div th:if="${#fields.hasErrors('availabilityDate')}" th:errors="*{availabilityDate}" class="text-danger small mt-2"></div>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6">
                    <label for="startDate" class="form-label">Fecha de inicio</label>
                    <input id="startDate" type="date" th:field="*{startDate}" th:attr="min=${today}" class="form-control" required>
                    <div th:if="${#fields.hasErrors('startDate')}" th:errors="*{startDate}" class="text-danger small mt-2"></div>
                </div>
                <div class="col-md-6">
                    <label for="endDate" class="form-label">Fecha de fin</label>
                    <input id="endDate" type="date" th:field="*{endDate}" th:attr="min=${today}" class="form-control" required>
                    <div th:if="${#fields.hasErrors('endDate')}" th:errors="*{endDate}" class="text-danger small mt-2"></div>
                </div>
            </div>
        </div>

        <!-- Sección: Ubicación -->
        <div class="form-section">
            <h2><i class="bi bi-geo-alt" aria-hidden="true"></i> Preferencia de Ubicación</h2>
            <div class="mb-3">
                <label for="preferredPc" class="form-label">Código postal preferido</label>
                <input id="preferredPc" type="text" th:field="*{preferredPc}" class="form-control" maxlength="10" placeholder="ej: 46001">
                <div th:if="${#fields.hasErrors('preferredPc')}" th:errors="*{preferredPc}" class="text-danger small mt-2"></div>
            </div>
        </div>

        <!-- Sección: Formación y Experiencia -->
        <div class="form-section">
            <h2><i class="bi bi-book" aria-hidden="true"></i> Requerimientos de Formación y Experiencia</h2>
            <div class="row">
                <div class="col-md-6">
                    <label for="training" class="form-label">Formación deseada</label>
                    <input id="training" type="text" th:field="*{training}" class="form-control" maxlength="100" placeholder="ej: Auxiliar de Enfermería">
                    <div th:if="${#fields.hasErrors('training')}" th:errors="*{training}" class="text-danger small mt-2"></div>
                </div>
                <div class="col-md-3">
                    <label for="experience" class="form-label">Experiencia mínima (años)</label>
                    <input id="experience" type="number" th:field="*{experience}" class="form-control" min="0" step="1" placeholder="0">
                    <div th:if="${#fields.hasErrors('experience')}" th:errors="*{experience}" class="text-danger small mt-2"></div>
                </div>
                <div class="col-md-3">
                    <label for="experienceType" class="form-label">Tipo de experiencia</label>
                    <select id="experienceType" th:field="*{experienceType}" class="form-select">
                        <option value="">Selecciona un tipo</option>
                        <option value="Formal">Formal</option>
                        <option value="Informal">Informal</option>
                        <option value="Mixta">Mixta</option>
                    </select>
                    <div th:if="${#fields.hasErrors('experienceType')}" th:errors="*{experienceType}" class="text-danger small mt-2"></div>
                </div>
            </div>
        </div>

        <!-- Sección: Preferencias Personales -->
        <div class="form-section">
            <h2><i class="bi bi-heart" aria-hidden="true"></i> Preferencias Personales</h2>
            <div class="row">
                <div class="col-md-6">
                    <label for="preferredGender" class="form-label">Género preferido del asistente</label>
                    <select id="preferredGender" th:field="*{preferredGender}" class="form-select">
                        <option value="">Sin preferencia</option>
                        <option value="F">Femenino</option>
                        <option value="M">Masculino</option>
                        <option value="Otro">Otro</option>
                    </select>
                    <div th:if="${#fields.hasErrors('preferredGender')}" th:errors="*{preferredGender}" class="text-danger small mt-2"></div>
                </div>
                <div class="col-md-6">
                    <label for="preferredAge" class="form-label">Edad preferida del asistente</label>
                    <input id="preferredAge" type="number" th:field="*{preferredAge}" class="form-control" min="0" step="1" placeholder="ej: 30">
                    <div th:if="${#fields.hasErrors('preferredAge')}" th:errors="*{preferredAge}" class="text-danger small mt-2"></div>
                </div>
            </div>
        </div>

        <div class="required-note">
            <strong><i class="bi bi-asterisk"></i> Campos obligatorios:</strong> Descripción de necesidades, Fecha de inicio y Fecha de fin.
        </div>

        <div class="btn-group-custom">
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-check-circle"></i> Enviar solicitud
            </button>
        </div>

    </form>
</main>
</body>
</html>
