<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Back-office - Revisión de solicitudes')}"></head>
<body>
<nav th:replace="~{fragments/topbar :: topbar}"></nav>
<header th:replace="~{fragments/page-header :: pageHeader(title='Back-office: Revisión y Propuestas', icon='bi-check2-all', subtitle='')}"></header>

<main class="container page-content mb-5">
    <div class="action-bar">
        <a href="/dashboard" class="action-link btn-outline-custom"><i class="bi bi-house"></i> Volver al dashboard</a>
        <a href="/requests/frontoffice/add" class="action-link btn-primary-custom"><i class="bi bi-plus-circle"></i> Nueva solicitud</a>
    </div>

    <h2 class="section-title"><i class="bi bi-hourglass-split" aria-hidden="true"></i> Solicitudes Pendientes de Revisión</h2>
    <div class="table-responsive">
        <table class="table table-hover">
            <thead>
                <tr>
                    <th><i class="bi bi-hash"></i> ID</th>
                    <th><i class="bi bi-people"></i> Usuario OVI</th>
                    <th><i class="bi bi-blockquote"></i> Descripción</th>
                    <th><i class="bi bi-calendar-range"></i> Período</th>
                    <th><i class="bi bi-check-circle"></i> Estado</th>
                    <th><i class="bi bi-tools"></i> Acción</th>
                </tr>
            </thead>
            <tbody>
                <tr th:if="${#lists.isEmpty(pendingRequests)}">
                    <td colspan="6" class="text-center text-muted py-4"><i class="bi bi-inbox"></i> No hay solicitudes en revisión</td>
                </tr>
                <tr th:each="request : ${pendingRequests}">
                    <td th:text="${request.idRequest}"></td>
                    <td th:text="${@nameMaps.oviUserNameById(request.idOviUser)}"></td>
                    <td th:text="${request.description}"></td>
                    <td th:text="${request.startDate + ' -> ' + request.endDate}"></td>
                    <td><span th:replace="~{fragments/status-badge :: statusBadge(${request.status})}"></span></td>
                    <td>
                        <a class="btn btn-sm btn-success" th:href="@{/requests/backoffice/review/{id}(id=${request.idRequest})}"><i class="bi bi-check2-circle"></i> Aprobar y proponer asistente</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <h2 class="section-title"><i class="bi bi-check-circle" aria-hidden="true"></i> Solicitudes Aprobadas sin contrato</h2>
    <div th:if="${!#lists.isEmpty(approvedRequests)}">
        <div class="list-group">
            <div class="list-group-item d-flex justify-content-between align-items-center" th:each="request : ${approvedRequests}">
                <div>
                    <h6 class="mb-1">
                        <strong>#<span th:text="${request.idRequest}"></span></strong>
                        · <span th:text="${@nameMaps.oviUserNameById(request.idOviUser)}"></span>
                        — <span th:text="${request.description}"></span>
                    </h6>
                    <small class="text-muted" th:text="${'Período: ' + request.startDate + ' -> ' + request.endDate}"></small>
                </div>
                <div class="d-flex gap-2 flex-wrap">
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/requests/backoffice/review/{id}(id=${request.idRequest})}"><i class="bi bi-eye"></i> Ver negociaciones</a>
                </div>
            </div>
        </div>
    </div>
    <p th:if="${#lists.isEmpty(approvedRequests)}" class="text-muted text-center py-4"><i class="bi bi-inbox"></i> Aún no hay solicitudes aprobadas</p>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/sgovi.js}" src="/js/sgovi.js"></script>
</body>
</html>
