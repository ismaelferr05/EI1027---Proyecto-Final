<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Crear solicitud')}"></head>
<body>
<nav th:replace="~{fragments/topbar :: topbar}"></nav>
<header th:replace="~{fragments/page-header :: pageHeader(title='Nueva solicitud', icon='bi-plus-circle', subtitle='')}"></header>

<main class="container page-content mb-5">
    
    <div th:replace="~{fragments/action-bar :: dashboardBackBar}"></div>

    <div class="form-section">
        <form class="form-horizontal" th:action="@{/requests/add}" th:object="${request}" method="post">
            <div class="row">
                <div class="col-md-12 mb-3">
                    <label for="description" class="form-label">Descripción:</label>
                    <textarea id="description" th:field="*{description}" class="form-control" rows="4"></textarea>
                    <div th:if="${#fields.hasErrors('description')}" th:errors="*{description}" class="text-danger small mt-2"></div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="training" class="form-label">Formación:</label>
                    <input id="training" type="text" th:field="*{training}" class="form-control" maxlength="100">
                    <div th:if="${#fields.hasErrors('training')}" th:errors="*{training}" class="text-danger small mt-2"></div>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="status" class="form-label">Estado:</label>
                    <select id="status" th:field="*{status}" class="form-select">
                        <option value="">Selecciona un estado</option>
                        <option value="IN_REVIEW">IN_REVIEW</option>
                        <option value="APPROVED">APPROVED</option>
                        <option value="REJECTED">REJECTED</option>
                        <option value="CONTRACT_ACTIVE">CONTRACT_ACTIVE</option>
                        <option value="CONTRACT_FINISHED">CONTRACT_FINISHED</option>
                    </select>
                    <div th:if="${#fields.hasErrors('status')}" th:errors="*{status}" class="text-danger small mt-2"></div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-4 mb-3">
                    <label for="startDate" class="form-label">Fecha inicio:</label>
                    <input id="startDate" type="date" th:field="*{startDate}" th:attr="min=${today}" class="form-control">
                    <div th:if="${#fields.hasErrors('startDate')}" th:errors="*{startDate}" class="text-danger small mt-2"></div>
                </div>
                <div class="col-md-4 mb-3">
                    <label for="endDate" class="form-label">Fecha fin:</label>
                    <input id="endDate" type="date" th:field="*{endDate}" class="form-control">
                    <div th:if="${#fields.hasErrors('endDate')}" th:errors="*{endDate}" class="text-danger small mt-2"></div>
                </div>
                <div class="col-md-4 mb-3">
                    <label for="experience" class="form-label">Experiencia:</label>
                    <input id="experience" type="number" th:field="*{experience}" class="form-control" min="0" step="1">
                    <div th:if="${#fields.hasErrors('experience')}" th:errors="*{experience}" class="text-danger small mt-2"></div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-4 mb-3">
                    <label for="experienceType" class="form-label">Tipo experiencia:</label>
                    <input id="experienceType" type="text" th:field="*{experienceType}" class="form-control" maxlength="50">
                    <div th:if="${#fields.hasErrors('experienceType')}" th:errors="*{experienceType}" class="text-danger small mt-2"></div>
                </div>
                <div class="col-md-4 mb-3">
                    <label for="preferredGender" class="form-label">Género preferido:</label>
                    <select id="preferredGender" th:field="*{preferredGender}" class="form-select">
                        <option value="">Sin preferencia</option>
                        <option value="Masculino">Masculino</option>
                        <option value="Femenino">Femenino</option>
                        <option value="Otro">Otro</option>
                    </select>
                    <div th:if="${#fields.hasErrors('preferredGender')}" th:errors="*{preferredGender}" class="text-danger small mt-2"></div>
                </div>
                <div class="col-md-4 mb-3">
                    <label for="preferredPc" class="form-label">CP preferido:</label>
                    <input id="preferredPc" type="text" th:field="*{preferredPc}" class="form-control" maxlength="10">
                    <div th:if="${#fields.hasErrors('preferredPc')}" th:errors="*{preferredPc}" class="text-danger small mt-2"></div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-4 mb-3">
                    <label for="preferredAge" class="form-label">Edad preferida:</label>
                    <input id="preferredAge" type="number" th:field="*{preferredAge}" class="form-control" min="0" step="1">
                    <div th:if="${#fields.hasErrors('preferredAge')}" th:errors="*{preferredAge}" class="text-danger small mt-2"></div>
                </div>
                <div class="col-md-8 mb-3">
                    <label for="idOviUser" class="form-label">Usuario OVI:</label>
                    <select id="idOviUser" th:field="*{idOviUser}" class="form-select">
                        <option value="">Selecciona un usuario OVI</option>
                        <option th:each="oviUser : ${oviUsers}" th:value="${oviUser.idOviUser}" th:text="|${oviUser.name} ${oviUser.lastName}|"></option>
                    </select>
                    <div th:if="${#fields.hasErrors('idOviUser')}" th:errors="*{idOviUser}" class="text-danger small mt-2"></div>
                </div>
            </div>

            <div class="btn-group-custom">
                <button type="submit" class="btn btn-primary"><i class="bi bi-check-circle"></i> Guardar solicitud</button>
                <a href="/requests/list" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Volver</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
