<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Solicitudes - SgOVI')}"></head>
<body>
<nav th:replace="~{fragments/topbar :: topbar}"></nav>
<header th:replace="~{fragments/page-header :: pageHeader(title='Listado de Solicitudes', icon='bi-file-text', subtitle='')}"></header>

<main class="container page-content mb-5">
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill"></i>
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>

    <div class="action-bar" th:if="${isOviUser}">
        <span>
            <a th:href="@{/requests/frontoffice/add}" class="action-link btn-primary-custom"><i class="bi bi-plus-circle"></i> Crear solicitud</a>
            <a th:href="@{/requests/frontoffice/track}" class="action-link btn-outline-custom"><i class="bi bi-search"></i> Mis solicitudes</a>
        </span>
    </div>

    <div th:replace="~{fragments/table-tools :: tableTools}" th:if="${tableAction != null}"></div>

    <div class="table-responsive">
        <table class="table table-hover">
            <thead>
                <tr>
                    <th th:if="${isTechnician}" class="table-action-col"><i class="bi bi-tools"></i> Gestión</th>
                    <th th:if="${isTechnician}"><i class="bi bi-people"></i> Usuario OVI</th>
                    <th><i class="bi bi-blockquote"></i> Descripción</th>
                    <th><i class="bi bi-calendar-range"></i> Periodo</th>
                    <th><i class="bi bi-book"></i> Formación</th>
                    <th><i class="bi bi-briefcase"></i> Estado</th>
                    <th><i class="bi bi-hash"></i> ID</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="request : ${requests}">
                    <td th:if="${isTechnician}" class="table-action-col">
                        <a th:href="@{/requests/backoffice/review/{id}(id=${request.idRequest})}" class="action-btn btn-view">
                            <i class="bi bi-arrow-right" aria-hidden="true"></i> Gestionar
                        </a>
                    </td>
                    <td th:if="${isTechnician}" th:text="${@nameMaps.oviUserNameById(request.idOviUser)}"></td>
                    <td th:text="${request.description}"></td>
                    <td th:text="${request.startDate + ' → ' + request.endDate}"></td>
                    <td th:text="${request.training != null ? request.training : '—'}"></td>
                    <td>
                        <span th:replace="~{fragments/status-badge :: statusBadge(${request.status})}"></span>
                    </td>
                    <td th:text="${request.idRequest}"></td>
                </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
