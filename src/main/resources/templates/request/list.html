<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Solicitudes - SgOVI')}"></head>
<body>
<nav th:replace="~{fragments/topbar :: topbar}"></nav>
<header th:replace="~{fragments/page-header :: pageHeader(title='Listado de Solicitudes', icon='bi-file-text', subtitle='')}"></header>

<main class="container page-content mb-5">
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill"></i>
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>

    <div class="action-bar">
        <a th:href="@{/dashboard}" class="action-link btn-outline-custom"><i class="bi bi-house"></i> Volver al dashboard</a>
        <span th:if="${isOviUser}">
            <a th:href="@{/requests/frontoffice/add}" class="action-link btn-primary-custom"><i class="bi bi-plus-circle"></i> Crear solicitud</a>
            <a th:href="@{/requests/frontoffice/track}" class="action-link btn-outline-custom"><i class="bi bi-search"></i> Mis solicitudes</a>
        </span>
    </div>

    <!-- Filtros para la gestión de solicitudes -->
    <form class="mb-3" method="get" th:action="@{/requests/list}">
        <div class="row g-2 align-items-end">
            <div class="col-auto">
                <label for="filter-type" class="form-label">Tipo (formación)</label>
                <input id="filter-type" type="text" name="type" class="form-control" th:value="${param.type}">
            </div>
            <div class="col-auto">
                <label for="filter-status" class="form-label">Estado</label>
                <select id="filter-status" name="status" class="form-select">
                    <option value="" th:selected="${param.status == null or param.status == ''}">Todos</option>
                    <option value="IN_REVIEW" th:selected="${param.status == 'IN_REVIEW'}">En revisión</option>
                    <option value="APPROVED" th:selected="${param.status == 'APPROVED'}">Aprobado</option>
                    <option value="REJECTED" th:selected="${param.status == 'REJECTED'}">Rechazado</option>
                </select>
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-primary">Filtrar</button>
                <a th:href="@{/requests/list}" class="btn btn-outline-secondary">Limpiar</a>
            </div>
        </div>
    </form>

    <div class="table-responsive">
        <table class="table table-hover">
            <thead>
                <tr>
                    <th><i class="bi bi-hash"></i> ID</th>
                    <th><i class="bi bi-blockquote"></i> Descripción</th>
                    <th th:if="${isTechnician}"><i class="bi bi-people"></i> Usuario OVI</th>
                    <th><i class="bi bi-book"></i> Formación</th>
                    <th><i class="bi bi-calendar"></i> Inicio</th>
                    <th><i class="bi bi-calendar"></i> Fin</th>
                    <th><i class="bi bi-briefcase"></i> Estado</th>
                    <th th:if="${isTechnician}"><i class="bi bi-tools"></i> Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="request : ${requests}">
                    <td th:text="${request.idRequest}"></td>
                    <td th:text="${request.description}"></td>
                    <td th:if="${isTechnician}" th:text="${@nameMaps.oviUserNameById(request.idOviUser)}"></td>
                    <td th:text="${request.training != null ? request.training : '—'}"></td>
                    <td th:text="${request.startDate}"></td>
                    <td th:text="${request.endDate}"></td>
                    <td>
                        <span th:replace="~{fragments/status-badge :: statusBadge(${request.status})}"></span>
                    </td>
                    <td th:if="${isTechnician}">
                        <a th:href="@{/requests/backoffice/review/{id}(id=${request.idRequest})}" class="action-btn btn-outline-custom" aria-label="Revisar"><i class="bi bi-eye" aria-hidden="true"></i></a>
                        <th:block th:if="${request.status == 'IN_REVIEW'}">
                            <a th:href="@{/requests/edit/{id}(id=${request.idRequest})}" class="action-btn btn-edit" aria-label="Editar"><i class="bi bi-pencil" aria-hidden="true"></i></a>
                            <a th:href="@{/requests/backoffice/review/{id}(id=${request.idRequest})}" class="action-btn btn-view" aria-label="Aprobar y proponer asistente"><i class="bi bi-check-circle" aria-hidden="true"></i></a>
                            <form th:action="@{/requests/reject}" method="post" style="display:inline-block;" onsubmit="return confirm('¿Confirmar rechazo de la solicitud?');">
                                <input type="hidden" name="idRequest" th:value="${request.idRequest}" />
                                <input type="text" name="reason" th:id="|reject-reason-${request.idRequest}|" aria-label="Motivo del rechazo" placeholder="Motivo" required class="form-control form-control-sm d-inline-block" style="width:120px;">
                                <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                <button type="submit" class="action-btn btn-delete" aria-label="Rechazar"><i class="bi bi-x-circle" aria-hidden="true"></i></button>
                            </form>
                        </th:block>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/sgovi.js}" src="/js/sgovi.js"></script>
</body>
</html>
