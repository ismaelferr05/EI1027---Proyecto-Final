<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Front-office - Seguimiento')}"></head>
<body>
<nav th:replace="~{fragments/topbar :: topbar}"></nav>
<header th:replace="~{fragments/page-header :: pageHeader(title=${isTechnician ? 'Solicitudes' : 'Mis solicitudes'}, icon='bi-search', subtitle='')}"></header>

<main class="container page-content mb-5">
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show alert-success-custom" role="alert">
        <i class="bi bi-check-circle-fill"></i>
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>

    <div class="card-panel" th:if="${currentOviUser != null or isTechnician}">
        <p class="mb-0" th:if="${!isTechnician}">
            Solicitudes de <strong th:text="|${currentOviUser.name} ${currentOviUser.lastName}|"></strong>
        </p>
        <p class="mb-0" th:if="${isTechnician}">
            Vista global de solicitudes del sistema.
        </p>
    </div>

    <div class="action-bar mb-4">
        <a th:if="${isTechnician}" href="/requests/add" class="action-link btn-primary-custom"><i class="bi bi-plus-circle"></i> Nueva solicitud</a>
        <a th:if="${isOviUser}" href="/requests/frontoffice/add" class="action-link btn-primary-custom"><i class="bi bi-plus-circle"></i> Nueva solicitud</a>
    </div>
    <div th:replace="~{fragments/table-tools :: tableTools}" th:if="${tableAction != null}"></div>


    <div class="table-responsive sgovi-table-shell mt-4">
        <table class="table table-striped align-middle">
            <thead>
            <tr>
                <th>Acción</th>
                <th>Descripcion</th>
                <th>Periodo</th>
                <th>Estado</th>
                <th>Motivo</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(requests)}">
                <td colspan="5" class="text-center">No hay solicitudes para mostrar.</td>
            </tr>
            <tr th:each="request : ${requests}" th:with="followUp=${followUpByRequestId[request.idRequest]}">
                <td class="table-action-col">
                    <a th:if="${followUp != null and followUp.contractId != null}"
                       class="btn btn-sm btn-outline-secondary"
                       th:href="@{/contracts/view/{id}(id=${followUp.contractId})}">
                        <i class="bi bi-file-earmark-text"></i> Ir a contrato
                    </a>
                    <a th:if="${(followUp == null or followUp.contractId == null) and request.status == 'APPROVED'}"
                       class="btn btn-sm btn-outline-primary"
                       th:href="@{/requests/frontoffice/view/{id}(id=${request.idRequest})}">
                        <i class="bi bi-eye"></i> Ver resolución
                    </a>
                    <span th:if="${(followUp == null or followUp.contractId == null) and request.status != 'APPROVED'}"
                          class="text-muted small">—</span>
                </td>
                <td th:text="${request.description}"></td>
                <td th:text="|${request.startDate} -> ${request.endDate}|"></td>
                <td>
                    <span th:replace="~{fragments/status-badge :: statusBadge(${request.status})}"></span>
                </td>
                <td>
                    <span th:if="${request.status == 'REJECTED'}" class="text-muted small" th:text="${request.rejectionReason != null ? request.rejectionReason : 'Rechazada'}"></span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <div th:replace="~{fragments/table-tools :: tablePager}" th:if="${tableAction != null}"></div>
</main>
</body>
</html>
