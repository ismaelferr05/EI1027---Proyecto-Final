<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<body>
<section th:fragment="tableTools" class="table-tools mb-3">
<form class="table-tools-form" method="get" th:action="${tableAction}">
    <input type="hidden" name="page" value="1">
    <div class="row g-2 align-items-end">
        <div class="col-md-3">
            <label for="table-q" class="form-label">Filtro</label>
            <input id="table-q" name="q" class="form-control" th:value="${tableQuery}" placeholder="Buscar por cualquier columna">
        </div>
        <div class="col-md-2" th:if="${tableStatusOptions != null and !tableStatusOptions.isEmpty()}">
            <label for="table-status" class="form-label">Estado</label>
            <select id="table-status" name="status" class="form-select">
                <option value="" th:selected="${tableStatus == null or tableStatus.isBlank()}">Todos</option>
                <option th:each="option : ${tableStatusOptions}"
                        th:value="${option.key}"
                        th:text="${option.value}"
                        th:selected="${option.key == tableStatus}"></option>
            </select>
        </div>
        <div class="col-md-2">
            <label for="table-sort" class="form-label">Ordenar por</label>
            <select id="table-sort" name="sort" class="form-select">
                <option th:each="option : ${tableSortOptions}"
                        th:value="${option.key}"
                        th:text="${option.value}"
                        th:selected="${option.key == tableSort}"></option>
            </select>
        </div>
        <div class="col-md-2">
            <label for="table-dir" class="form-label">Dirección</label>
            <select id="table-dir" name="dir" class="form-select">
                <option value="asc" th:selected="${tableDir != 'desc'}">Ascendente</option>
                <option value="desc" th:selected="${tableDir == 'desc'}">Descendente</option>
            </select>
        </div>
        <div class="col-md-1">
            <label for="table-size" class="form-label">Filas</label>
            <select id="table-size" name="size" class="form-select">
                <option value="3" th:selected="${tableSize == 3}">3</option>
                <option value="10" th:selected="${tableSize == 10}">10</option>
                <option value="20" th:selected="${tableSize == 20}">20</option>
            </select>
        </div>
        <div class="col-md-2 d-flex gap-2">
            <button type="submit" class="btn btn-primary flex-fill">Aplicar</button>
            <a th:href="${tableAction}" class="btn btn-outline-secondary">Limpiar</a>
        </div>
    </div>
</form>
<div class="table-tools-footer" th:if="${tableTotalPages > 1}">
    <nav class="table-pager" aria-label="Paginación de tabla">
        <ul class="pagination mb-0">
            <li class="page-item" th:classappend="${!tableHasPrevious} ? 'disabled'">
                <a class="page-link page-link-step"
                   th:href="${tableAction + '?q=' + tableQueryEncoded + '&status=' + tableStatusEncoded + '&sort=' + tableSort + '&dir=' + tableDir + '&size=' + tableSize + '&page=' + (tableHasPrevious ? tablePage - 1 : tablePage)}"
                   th:attr="aria-disabled=${!tableHasPrevious}"
                   aria-label="Anterior">Anterior</a>
            </li>
            <li class="page-item" th:each="pageNumber : ${tablePages}" th:classappend="${pageNumber == tablePage} ? 'active'">
                <a class="page-link page-link-number"
                   th:href="${tableAction + '?q=' + tableQueryEncoded + '&status=' + tableStatusEncoded + '&sort=' + tableSort + '&dir=' + tableDir + '&size=' + tableSize + '&page=' + pageNumber}"
                   th:text="${pageNumber}">1</a>
            </li>
            <li class="page-item" th:classappend="${!tableHasNext} ? 'disabled'">
                <a class="page-link page-link-step"
                   th:href="${tableAction + '?q=' + tableQueryEncoded + '&status=' + tableStatusEncoded + '&sort=' + tableSort + '&dir=' + tableDir + '&size=' + tableSize + '&page=' + (tableHasNext ? tablePage + 1 : tablePage)}"
                   th:attr="aria-disabled=${!tableHasNext}"
                   aria-label="Siguiente">Siguiente</a>
            </li>
        </ul>
    </nav>
</div>
</section>
</body>
</html>
