<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Usuarios OVI - SgOVI')}"></head>
<body>
<nav th:replace="~{fragments/topbar :: topbar}"></nav>
<header th:replace="~{fragments/page-header :: pageHeader(title='Listado de Usuarios OVI', icon='bi-people', subtitle='')}"></header>

<main class="container page-content mb-5">
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill"></i>
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>

    <div class="action-bar">
        <a href="/dashboard" class="action-link btn-outline-custom"><i class="bi bi-house"></i> Volver al dashboard</a>
        <a href="/ovi-users/add" class="action-link btn-primary-custom"><i class="bi bi-plus-circle"></i> Agregar usuario</a>
    </div>

    <div class="table-responsive">
        <table class="table table-hover">
            <thead>
                <tr>
                    <th><i class="bi bi-hash"></i> ID</th>
                    <th><i class="bi bi-person"></i> Nombre</th>
                    <th><i class="bi bi-person"></i> Apellidos</th>
                    <th><i class="bi bi-envelope"></i> Email</th>
                    <th><i class="bi bi-telephone"></i> Teléfono</th>
                    <th><i class="bi bi-geo-alt"></i> Provincia</th>
                    <th><i class="bi bi-building"></i> Ciudad</th>
                    <th><i class="bi bi-mailbox"></i> CP</th>
                    <th><i class="bi bi-cake2"></i> Edad</th>
                    <th><i class="bi bi-person-fill"></i> Género</th>
                    <th><i class="bi bi-check-circle"></i> Estado</th>
                    <th><i class="bi bi-shield-check"></i> LOPD</th>
                    <th><i class="bi bi-tools"></i> Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="oviUser : ${oviUsers}">
                    <td th:text="${oviUser.idOviUser}"></td>
                    <td th:text="${oviUser.name}"></td>
                    <td th:text="${oviUser.lastName}"></td>
                    <td th:text="${oviUser.email}"></td>
                    <td th:text="${oviUser.phone}"></td>
                    <td th:text="${oviUser.province}"></td>
                    <td th:text="${oviUser.town}"></td>
                    <td th:text="${oviUser.pc}"></td>
                    <td th:text="${oviUser.age}"></td>
                    <td th:text="${oviUser.gender}"></td>
                    <td><span th:replace="~{fragments/status-badge :: statusBadge(${oviUser.status})}"></span></td>
                    <td th:text="${oviUser.lopdConsent ? 'Sí' : 'No'}"></td>
                    <td>
                        <a th:href="@{/ovi-users/view/{id}(id=${oviUser.idOviUser})}" class="action-btn btn-edit"><i class="bi bi-eye"></i></a>
                        <a th:href="@{/ovi-users/edit/{id}(id=${oviUser.idOviUser})}" class="action-btn btn-edit"><i class="bi bi-pencil"></i></a>
                        <form th:if="${oviUser.status == 'PENDING'}" th:action="@{/ovi-users/accept}" method="post" style="display:inline-block;">
                            <input type="hidden" name="idOviUser" th:value="${oviUser.idOviUser}">
                            <button type="submit" class="action-btn btn-edit"><i class="bi bi-check"></i></button>
                        </form>
                        <form th:if="${oviUser.status != 'REJECTED'}" th:action="@{/ovi-users/reject}" method="post" style="display:inline-block;">
                            <input type="hidden" name="idOviUser" th:value="${oviUser.idOviUser}">
                            <input type="text" name="reason" placeholder="Motivo" required class="form-control form-control-sm d-inline-block" style="width:120px;">
                            <button type="submit" class="action-btn btn-delete"><i class="bi bi-x"></i></button>
                        </form>
                        <a th:href="@{/ovi-users/delete/{id}(id=${oviUser.idOviUser})}" class="action-btn btn-delete" onclick="return confirm('¿Confirmar eliminación?')"><i class="bi bi-trash"></i></a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/sgovi.js}" src="/js/sgovi.js"></script>
</body>
</html>
