<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Alta usuario OVI')}"></head>
<body>
<nav th:replace="~{fragments/topbar :: topbar}"></nav>
<header th:replace="~{fragments/page-header :: pageHeader(title='Solicitud de alta como usuario OVI', icon='bi-person-plus', subtitle='')}"></header>
<main class="container page-content mb-5">
    
    <div class="action-bar">
        <a th:href="@{/}" class="action-link btn-outline-custom"><i class="bi bi-house"></i> Volver al inicio</a>
    </div>
<form th:action="@{/ovi-users/register}" th:object="${oviUser}" method="post" class="bg-white p-4 rounded shadow-sm">
        <div class="row g-3">
            <div class="col-md-6"><label class="form-label">Nombre</label><input th:field="*{name}" class="form-control"><div th:errors="*{name}" class="text-danger small"></div></div>
            <div class="col-md-6"><label class="form-label">Apellidos</label><input th:field="*{lastName}" class="form-control"><div th:errors="*{lastName}" class="text-danger small"></div></div>
            <div class="col-md-6"><label class="form-label">Email</label><input th:field="*{email}" type="email" class="form-control"><div th:errors="*{email}" class="text-danger small"></div></div>
            <div class="col-md-6"><label class="form-label">Teléfono</label><input th:field="*{phone}" class="form-control"><div th:errors="*{phone}" class="text-danger small"></div></div>
            <div class="col-md-6"><label class="form-label">Contraseña</label><input th:field="*{password}" type="password" class="form-control"><div th:errors="*{password}" class="text-danger small"></div></div>
            <div class="col-md-6"><label class="form-label">Provincia</label><input th:field="*{province}" class="form-control"></div>
            <div class="col-md-4"><label class="form-label">Población</label><input th:field="*{town}" class="form-control"></div>
            <div class="col-md-4"><label class="form-label">CP</label><input th:field="*{pc}" class="form-control"></div>
            <div class="col-md-4"><label class="form-label">Edad</label><input th:field="*{age}" type="number" class="form-control"></div>
            <div class="col-md-6"><label class="form-label">Género</label><input th:field="*{gender}" class="form-control"></div>
            <div class="col-md-6 d-flex align-items-end"><label class="form-check"><input th:field="*{lopdConsent}" type="checkbox" class="form-check-input"> Acepto LOPD</label><div th:errors="*{lopdConsent}" class="text-danger small ms-3"></div></div>
        </div>
        <input type="hidden" th:field="*{status}">
        <button class="btn btn-primary mt-4" type="submit">Enviar solicitud</button>
        <a href="/index.html" class="btn btn-outline-secondary mt-4">Volver</a>
    </form>
</main>
<script th:src="@{/js/sgovi.js}" src="/js/sgovi.js"></script>
</body>
</html>
