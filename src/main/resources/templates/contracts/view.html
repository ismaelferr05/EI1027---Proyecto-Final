<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Contrato')}"></head>
<body>
<nav th:replace="~{fragments/topbar :: topbar}"></nav>
<header th:replace="~{fragments/page-header :: pageHeader(title=|Contrato #${contract.idContract}|, icon='bi-file-earmark-text', subtitle='')}"></header>
<main class="container page-content mb-5">
    
    <div class="action-bar">
        <a th:if="${isTechnician}" href="/contracts/list" class="action-link btn-outline-custom"><i class="bi bi-arrow-left"></i> Volver a contratos</a>
        <a th:if="${isPapPati}" th:href="@{/contracts/pappati/list}" class="action-link btn-outline-custom"><i class="bi bi-arrow-left"></i> Volver a mis contratos</a>
        <a th:if="${isOviUser}" th:href="@{/contracts/oviuser/list}" class="action-link btn-outline-custom"><i class="bi bi-arrow-left"></i> Volver a mis contratos</a>
        <a th:unless="${isTechnician or isPapPati or isOviUser}" th:href="@{/dashboard}" class="action-link btn-outline-custom"><i class="bi bi-house"></i> Volver al dashboard</a>
    </div>

    <div class="panel-card">
        <p><strong>Salario:</strong> <span th:text="|€ ${contract.wage}|"></span></p>
        <p><strong>Inicio:</strong> <span th:text="${contract.startDate}"></span></p>
        <p><strong>Fin:</strong> <span th:text="${contract.endDate}"></span></p>
        <p><strong>Estado:</strong>
            <span th:with="contractStatus=${contract.endDate.isBefore(T(java.time.LocalDate).now()) ? 'FINALIZADO' : 'ACTIVO'}"
                  th:replace="~{fragments/status-badge :: statusBadge(${contractStatus})}"></span>
        </p>
        <p><strong>Negociación:</strong> <span th:text="${contract.idNegotiation}"></span></p>
        <a th:href="@{/contracts/document/{id}(id=${contract.idContract})}" class="action-link btn-primary-custom mt-3" target="_blank" rel="noopener noreferrer">
            <i class="bi bi-download" aria-hidden="true"></i> Abrir documento
        </a>
    </div>
</main>
<script th:src="@{/js/sgovi.js}" src="/js/sgovi.js"></script>
</body>
</html>
