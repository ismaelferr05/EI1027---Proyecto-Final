<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mis contratos</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"></head>
<body class="bg-light">
<main class="container py-5">
    <h1>Mis contratos</h1>
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div class="mb-3">
        <a href="/contracts/add" class="btn btn-primary"><i class="bi bi-plus-circle"></i> Registrar contrato</a>
        <a href="/dashboard" class="btn btn-outline-secondary">Inicio</a>
    </div>
    <table class="table table-striped bg-white">
        <thead><tr><th>ID</th><th>Salario</th><th>Inicio</th><th>Fin</th><th>Estado</th><th>Documento</th><th>Acciones</th></tr></thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(contracts)}"><td colspan="7">No tienes contratos registrados.</td></tr>
        <tr th:each="contract : ${contracts}">
            <td th:text="${contract.idContract}"></td>
            <td th:text="|€ ${contract.wage}|"></td>
            <td th:text="${contract.startDate}"></td>
            <td th:text="${contract.endDate}"></td>
            <td th:text="${contract.endDate.isBefore(T(java.time.LocalDate).now()) ? 'FINALIZADO' : 'ACTIVO'}"></td>
            <td><a th:href="${contract.url}" target="_blank">Ver</a></td>
            <td>
                <a th:href="@{/contracts/view/{id}(id=${contract.idContract})}" class="btn btn-sm btn-outline-primary">Detalle</a>
                <a th:href="@{/contracts/edit/{id}(id=${contract.idContract})}" class="btn btn-sm btn-outline-secondary">Editar</a>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
