<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Mis contratos')}"></head>
<body>
<nav th:replace="~{fragments/topbar :: topbar}"></nav>
<header th:replace="~{fragments/page-header :: pageHeader(title='Mis contratos', icon='bi-file-earmark-text', subtitle='')}"></header>
<main class="container page-content mb-5">
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    
    <div class="action-bar">
        <a href="/contracts/add" class="action-link btn-primary-custom"><i class="bi bi-plus-circle"></i> Registrar contrato</a>
    </div>
    <div th:replace="~{fragments/table-tools :: tableTools}" th:if="${tableAction != null}"></div>

    <div class="table-responsive sgovi-table-shell">
    <table class="table table-striped bg-white">
        <thead>
        <tr>
            <th class="table-action-col">Gestión</th>
            <th>PAP/PATI</th>
            <th>Salario</th>
            <th>Vigencia</th>
            <th>Estado</th>
            <th>Documento</th>
            <th>ID</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(contracts)}"><td colspan="7">No tienes contratos registrados.</td></tr>
        <tr th:each="contract : ${contracts}"
            th:with="neg=${@nameMaps.negotiationById(contract.idNegotiation)}">
            <td class="table-action-col">
                <a th:href="@{/contracts/view/{id}(id=${contract.idContract})}" class="action-btn btn-view">Detalle</a>
            </td>
            <td th:text="${neg != null ? @nameMaps.papPatiNameById(neg.idPapPati) : '—'}">PAP/PATI</td>
            <td th:text="|€ ${contract.wage}|"></td>
            <td th:text="|${contract.startDate} → ${contract.endDate}|"></td>
            <td th:with="contractStatus=${contract.endDate.isBefore(T(java.time.LocalDate).now()) ? 'FINALIZADO' : 'ACTIVO'}">
                <span th:replace="~{fragments/status-badge :: statusBadge(${contractStatus})}"></span>
            </td>
            <td><a th:href="@{/contracts/document/{id}(id=${contract.idContract})}" target="_blank" rel="noopener noreferrer">Ver documento</a></td>
            <td th:text="${contract.idContract}"></td>
        </tr>
        </tbody>
    </table>
    </div>
</main>
</body>
</html>
