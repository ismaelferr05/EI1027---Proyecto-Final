<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Contratos - SgOVI')}"></head>
<body>
<nav th:replace="~{fragments/topbar :: topbar}"></nav>
<header th:replace="~{fragments/page-header :: pageHeader(title='Listado de Contratos', icon='bi-file-earmark-pdf', subtitle='')}"></header>

<main class="container page-content mb-5">
    <div class="action-bar">
        <a href="/dashboard" class="action-link btn-outline-custom"><i class="bi bi-house"></i> Volver al dashboard</a>
        <a href="/contracts/add" class="action-link btn-primary-custom"><i class="bi bi-plus-circle"></i> Nuevo contrato</a>
    </div>

    <div class="table-responsive sgovi-table-shell">
    <table class="table table-hover">
        <thead>
            <tr>
                <th><i class="bi bi-hash"></i> ID</th>
                <th><i class="bi bi-cash-coin"></i> Salario</th>
                <th><i class="bi bi-calendar-range"></i> Fecha Inicio</th>
                <th><i class="bi bi-calendar-range"></i> Fecha Fin</th>
                <th><i class="bi bi-link"></i> Documento</th>
                <th><i class="bi bi-arrow-left-right"></i> Negociación</th>
                <th><i class="bi bi-tools"></i> Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="contract : ${contracts}">
                <td th:text="${contract.idContract}"></td>
                <td th:text="|€ ${contract.wage}|"></td>
                <td th:text="${contract.startDate}"></td>
                <td th:text="${contract.endDate}"></td>
                <td><a th:href="${contract.url}" target="_blank" class="action-btn btn-view"><i class="bi bi-download"></i> Ver PDF</a></td>
                <td th:text="${contract.idNegotiation}"></td>
                <td>
                    <a th:href="@{/contracts/view/{id}(id=${contract.idContract})}" class="action-btn btn-view"><i class="bi bi-eye"></i> Detalles</a>
                    <a th:href="@{/contracts/edit/{id}(id=${contract.idContract})}" class="action-btn btn-view"><i class="bi bi-pencil"></i> Editar</a>
                </td>
            </tr>
        </tbody>
    </table>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/sgovi.js}" src="/js/sgovi.js"></script>
</body>
</html>
