<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Contratos - SgOVI')}"></head>
<body>
<nav th:replace="~{fragments/topbar :: topbar}"></nav>
<header th:replace="~{fragments/page-header :: pageHeader(title='Listado de Contratos', icon='bi-file-earmark-text', subtitle='')}"></header>

<main class="container page-content mb-5">
    <div class="action-bar">
        <a href="/contracts/add" class="action-link btn-primary-custom"><i class="bi bi-plus-circle"></i> Nuevo contrato</a>
    </div>
    <div th:replace="~{fragments/table-tools :: tableTools}" th:if="${tableAction != null}"></div>


    <div class="table-responsive sgovi-table-shell">
    <table class="table table-hover">
        <thead>
            <tr>
                <th><i class="bi bi-hash"></i> ID</th>
                <th><i class="bi bi-cash-coin"></i> Salario</th>
                <th><i class="bi bi-calendar-range"></i> Vigencia</th>
                <th><i class="bi bi-people"></i> Usuario OVI</th>
                <th><i class="bi bi-person-arms-up"></i> PAP/PATI</th>
                <th><i class="bi bi-link"></i> Documento</th>
                <th><i class="bi bi-tools"></i> Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="contract : ${contracts}"
                th:with="neg=${@nameMaps.negotiationById(contract.idNegotiation)},
                         req=${neg != null ? @nameMaps.requestById(neg.idRequest) : null}">
                <td th:text="${contract.idContract}"></td>
                <td th:text="|€ ${contract.wage}|"></td>
                <td th:text="|${contract.startDate} → ${contract.endDate}|"></td>
                <td th:text="${req != null ? @nameMaps.oviUserNameById(req.idOviUser) : '—'}">Usuario OVI</td>
                <td th:text="${neg != null ? @nameMaps.papPatiNameById(neg.idPapPati) : '—'}">PAP/PATI</td>
                <td><a th:href="@{/contracts/document/{id}(id=${contract.idContract})}" target="_blank" rel="noopener noreferrer" class="action-btn btn-view"><i class="bi bi-download" aria-hidden="true"></i> Ver documento</a></td>
                <td>
                    <a th:href="@{/contracts/view/{id}(id=${contract.idContract})}" class="action-btn btn-view"><i class="bi bi-eye"></i> Detalles</a>
                    <a th:href="@{/contracts/edit/{id}(id=${contract.idContract})}" class="action-btn btn-view"><i class="bi bi-pencil"></i> Editar</a>
                </td>
            </tr>
        </tbody>
    </table>
    </div>
</main>
</body>
</html>
