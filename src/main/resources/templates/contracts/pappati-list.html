<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Mis Contratos - SgOVI')}"></head>
<body>
<nav th:replace="~{fragments/topbar :: topbar}"></nav>
<header th:replace="~{fragments/page-header :: pageHeader(title='Mis Contratos', icon='bi-file-earmark-pdf', subtitle='')}"></header>

<main class="container page-content mb-5">
    <div class="user-card" th:if="${currentPapPati != null}">
        <i class="bi bi-person-circle"></i>
        <strong th:text="|${currentPapPati.name} ${currentPapPati.lastName}|">PapPati</strong>
        <span class="text-muted" th:text="| · ${currentPapPati.email}|"></span>
    </div>

    <div class="action-bar">
        <a href="/dashboard" class="action-link btn-outline-custom"><i class="bi bi-house"></i> Volver al dashboard</a>
        <a href="/messages/list" class="action-link btn-outline-custom"><i class="bi bi-chat-left-text"></i> Mis mensajes</a>
    </div>

    <div class="table-responsive" th:if="${not #lists.isEmpty(contracts)}">
        <table class="table table-hover">
            <thead>
                <tr>
                    <th><i class="bi bi-hash"></i> ID</th>
                    <th><i class="bi bi-cash-coin"></i> Salario (€/h)</th>
                    <th><i class="bi bi-calendar-range"></i> Inicio</th>
                    <th><i class="bi bi-calendar-range"></i> Fin</th>
                    <th><i class="bi bi-arrow-left-right"></i> Negociación</th>
                    <th><i class="bi bi-file-earmark-arrow-down"></i> Documento</th>
                    <th><i class="bi bi-info-circle"></i> Estado</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="contract : ${contracts}">
                    <td th:text="${contract.idContract}"></td>
                    <td th:text="|€ ${contract.wage}|"></td>
                    <td th:text="${contract.startDate}"></td>
                    <td th:text="${contract.endDate}"></td>
                    <td th:text="${contract.idNegotiation}"></td>
                    <td>
                        <a th:href="${contract.url}" target="_blank" rel="noopener noreferrer" class="btn-view">
                            <i class="bi bi-download"></i> Ver PDF
                        </a>
                    </td>
                    <td th:with="contractStatus=${contract.endDate.isBefore(T(java.time.LocalDate).now()) ? 'FINALIZADO' : 'ACTIVO'}">
                        <span th:replace="~{fragments/status-badge :: statusBadge(${contractStatus})}"></span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="empty-card" th:if="${#lists.isEmpty(contracts)}">
        <i class="bi bi-inbox" style="font-size: 2rem;"></i>
        <p class="mb-0 mt-2">No tienes contratos registrados por ahora.</p>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/sgovi.js}" src="/js/sgovi.js"></script>
</body>
</html>
