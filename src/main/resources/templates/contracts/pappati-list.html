<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Mis Contratos - SgOVI')}"></head>
<body>
<nav th:replace="~{fragments/topbar :: topbar}"></nav>
<header th:replace="~{fragments/page-header :: pageHeader(title='Mis Contratos', icon='bi-file-earmark-text', subtitle='Contratos vinculados a tus negociaciones con usuarios OVI')}"></header>

<main class="container page-content mb-5">
    <div class="profile-strip" th:if="${currentPapPati != null}">
        <div class="profile-strip-avatar" aria-hidden="true">
            <i class="bi bi-person-circle"></i>
        </div>
        <div class="profile-strip-body">
            <div class="profile-strip-name" th:text="|${currentPapPati.name} ${currentPapPati.lastName}|">PAP/PATI</div>
            <div class="profile-strip-meta">
                <span th:text="${currentPapPati.email}">email@example.com</span>
                <span class="profile-strip-sep" aria-hidden="true">·</span>
                <span th:replace="~{fragments/status-badge :: statusBadge(${currentPapPati.status})}"></span>
            </div>
        </div>
    </div>

    <div class="stats-row" th:if="${not #lists.isEmpty(contracts)}">
        <div class="stat-chip">
            <span class="stat-chip-label">Total</span>
            <strong class="stat-chip-value" th:text="${contractCount}">0</strong>
        </div>
        <div class="stat-chip">
            <span class="stat-chip-label">Activos</span>
            <strong class="stat-chip-value" th:text="${activeContractCount}">0</strong>
        </div>
    </div>

    <div class="contract-list" th:if="${not #lists.isEmpty(contracts)}">
        <article class="contract-card" th:each="contract : ${contracts}"
                 th:with="neg=${@nameMaps.negotiationById(contract.idNegotiation)},
                          req=${neg != null ? @nameMaps.requestById(neg.idRequest) : null},
                          contractStatus=${contract.endDate.isBefore(T(java.time.LocalDate).now()) ? 'FINALIZADO' : 'ACTIVO'}">
            <div class="contract-card-head">
                <div>
                    <h2 class="contract-card-title" th:text="|Contrato #${contract.idContract}|">Contrato #1</h2>
                    <p class="contract-card-subtitle" th:text="${req != null ? @nameMaps.oviUserNameById(req.idOviUser) : 'Usuario OVI'}">Usuario OVI</p>
                </div>
                <span th:replace="~{fragments/status-badge :: statusBadge(${contractStatus})}"></span>
            </div>

            <div class="meta-grid">
                <div class="meta-item">
                    <span class="meta-label">Salario</span>
                    <span class="meta-value" th:text="|€ ${contract.wage}/h|">€ 15.50/h</span>
                </div>
                <div class="meta-item">
                    <span class="meta-label">Inicio</span>
                    <span class="meta-value" th:text="${contract.startDate}">2026-05-01</span>
                </div>
                <div class="meta-item">
                    <span class="meta-label">Fin</span>
                    <span class="meta-value" th:text="${contract.endDate}">2026-12-31</span>
                </div>
            </div>

            <div class="contract-card-actions">
                <a th:href="@{/contracts/view/{id}(id=${contract.idContract})}" class="action-link btn-outline-custom">
                    <i class="bi bi-eye"></i> Ver detalle
                </a>
                <a th:href="@{/contracts/document/{id}(id=${contract.idContract})}" target="_blank" rel="noopener noreferrer" class="action-link btn-primary-custom">
                    <i class="bi bi-download" aria-hidden="true"></i> Descargar documento
                </a>
            </div>
        </article>
    </div>

    <div class="empty-state text-center" th:if="${#lists.isEmpty(contracts)}">
        <i class="bi bi-file-earmark-x" style="font-size: 2rem;" aria-hidden="true"></i>
        <h5 class="mt-3 mb-2">Aún no tienes contratos</h5>
        <p class="text-muted mb-3">Cuando el técnico formalice un acuerdo tras una negociación, aparecerá aquí el documento.</p>
        <a href="/messages/list" class="action-link btn-primary-custom">
            <i class="bi bi-chat-left-text"></i> Ir a mis negociaciones
        </a>
    </div>
</main>
</body>
</html>
