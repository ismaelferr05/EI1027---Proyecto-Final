<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Editar contrato')}"></head>
<body>
<nav th:replace="~{fragments/topbar :: topbar}"></nav>
<header th:replace="~{fragments/page-header :: pageHeader(title='Editar Contrato', icon='bi-pencil-square', subtitle='')}"></header>

<main class="container page-content mb-5">
    
    <div th:replace="~{fragments/action-bar :: dashboardBackBar}"></div>

    <div class="form-section">
        <form th:action="@{/contracts/edit}" th:object="${contract}" method="post">
            <input type="hidden" th:field="*{idContract}" />

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="wage" class="form-label">Salario (€):</label>
                    <input id="wage" type="number" th:field="*{wage}" class="form-control" min="0.01" step="0.01" />
                    <div th:if="${#fields.hasErrors('wage')}" th:errors="*{wage}" class="text-danger small mt-2"></div>
                </div>

                <div class="col-md-6 mb-3">
                    <label for="idNegotiation" class="form-label">Negociación:</label>
                    <input th:if="${isOviUserEditor}" id="idNegotiation" type="text" class="form-control" th:value="|Negociación #${contract.idNegotiation}|" readonly />
                    <input th:if="${isOviUserEditor}" type="hidden" th:field="*{idNegotiation}" />
                    <select th:unless="${isOviUserEditor}" id="idNegotiation" th:field="*{idNegotiation}" class="form-select">
                        <option value="">Sin negociación</option>
                        <option th:each="negotiation : ${negotiations}" th:value="${negotiation.idNegotiation}" th:text="${negotiation.stateOfApproval}"></option>
                    </select>
                    <div th:if="${#fields.hasErrors('idNegotiation')}" th:errors="*{idNegotiation}" class="text-danger small mt-2"></div>
                </div>
            </div>


            <div class="mb-3">
                <label for="url" class="form-label">URL del Documento:</label>
                <input id="url" type="text" th:field="*{url}" class="form-control" maxlength="255" />
                <div th:if="${#fields.hasErrors('url')}" th:errors="*{url}" class="text-danger small mt-2"></div>
            </div>

            <div class="btn-group-custom">
                <button type="submit" class="btn btn-primary"><i class="bi bi-check-circle"></i> Guardar Cambios</button>
                <a th:href="${isOviUserEditor} ? '/contracts/oviuser/list' : '/contracts/list'" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Volver</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
