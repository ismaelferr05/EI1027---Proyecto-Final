<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Mensajes - SgOVI')}"></head>
<body>
<nav th:replace="~{fragments/topbar :: topbar}"></nav>
<header th:replace="~{fragments/page-header :: pageHeader(title='Mensajes', icon='bi-chat-left-text', subtitle='')}"></header>

<main class="container page-content mb-5">
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill"></i>
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>

    <div class="card-panel" th:if="${isTechnician}">
        <strong><i class="bi bi-info-circle"></i> Vista de administración</strong>
        <div class="text-muted mt-1">Desde aquí puedes revisar, editar y eliminar mensajes.</div>
    </div>

    <div class="action-bar" th:if="${isTechnician}">
        <a href="/messages/add" class="action-link btn-primary-custom">
            <i class="bi bi-plus-circle"></i> Nuevo mensaje
        </a>
    </div>

    <div th:if="${#lists.isEmpty(messages)}" class="empty-state">
        <i class="bi bi-inbox" style="font-size: 2rem;"></i>
        <h5 class="mt-3 mb-2">No hay mensajes para mostrar</h5>
        <p class="mb-0">Cuando existan mensajes relacionados contigo, aparecerán aquí.</p>
    </div>
    <div th:replace="~{fragments/table-tools :: tableTools}" th:if="${tableAction != null}"></div>


    <div class="table-responsive table-wrapper" th:if="${!#lists.isEmpty(messages)}">
        <table class="table table-hover align-middle">
            <thead>
            <tr>
                <th th:if="${isTechnician}" class="table-action-col"><i class="bi bi-tools"></i> Gestión</th>
                <th><i class="bi bi-chat-left-text"></i> Texto</th>
                <th><i class="bi bi-person"></i> Remitente</th>
                <th><i class="bi bi-person-check"></i> Destinatario</th>
                <th><i class="bi bi-diagram-3"></i> Negociación</th>
                <th><i class="bi bi-calendar-event"></i> Fecha/Hora</th>
                <th><i class="bi bi-hash"></i> ID</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="message : ${messages}"
                th:with="neg=${@nameMaps.negotiationById(message.idNegotiation)},
                         req=${neg != null ? @nameMaps.requestById(neg.idRequest) : null}">
                <td th:if="${isTechnician}" class="table-action-col">
                    <a th:href="@{/messages/edit/{id}(id=${message.idMessage})}" class="action-btn btn-view">
                        <i class="bi bi-pencil"></i> Editar
                    </a>
                </td>
                <td class="msg-text" th:text="${message.text}"></td>
                <td><span class="badge-custom badge-tech" th:text="${message.sender}"></span></td>
                <td><span class="badge-custom badge-user" th:text="${message.receiver}"></span></td>
                <td class="small">
                    <span th:text="|#${message.idNegotiation}|">#1</span>
                    <span th:if="${neg != null and req != null}" class="text-muted"
                          th:text="| · ${@nameMaps.oviUserNameById(req.idOviUser)} ↔ ${@nameMaps.papPatiNameById(neg.idPapPati)}|"></span>
                </td>
                <td th:text="${message.messageDateTime}"></td>
                <td th:text="${message.idMessage}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
