<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Mis chats - SgOVI')}"></head>
<body>
<nav th:replace="~{fragments/topbar :: topbar}"></nav>
<header th:replace="~{fragments/page-header :: pageHeader(title=${isTechnician ? 'Chats' : 'Mis chats'}, icon='bi-chat-left-text', subtitle='')}"></header>

<main class="container page-content mb-5">
	<div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
		<span th:text="${successMessage}"></span>
		<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
	</div>
	<div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
		<span th:text="${errorMessage}"></span>
		<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
	</div>

	<div th:replace="~{fragments/table-tools :: tableTools}" th:if="${tableAction != null}"></div>

	<div class="table-responsive">
		<table class="table table-hover align-middle">
			<thead>
				<tr>
					<th class="table-action-col"><i class="bi bi-chat-dots"></i> Chat</th>
					<th><i class="bi bi-check-circle"></i> Estado</th>
					<th><i class="bi bi-person"></i> Usuario OVI</th>
					<th><i class="bi bi-person-badge"></i> PAP/PATI</th>
					<th><i class="bi bi-blockquote"></i> Solicitud</th>
					<th><i class="bi bi-file-earmark-text"></i> Contrato</th>
					<th><i class="bi bi-envelope"></i> Mensajes</th>
					<th><i class="bi bi-clock-history"></i> Último mensaje</th>
					<th><i class="bi bi-hash"></i> Negociación</th>
				</tr>
			</thead>
			<tbody>
				<tr th:if="${#lists.isEmpty(chats)}">
					<td colspan="9" class="text-center text-muted py-4"><i class="bi bi-inbox"></i> No hay chats con esos filtros</td>
				</tr>
				<tr th:each="chat : ${chats}">
					<td class="table-action-col">
						<a class="action-btn btn-view" th:href="@{/messages/chat/{idNegotiation}(idNegotiation=${chat.negotiation.idNegotiation})}">
							<i class="bi bi-arrow-right"></i> Abrir
						</a>
					</td>
					<td><span th:replace="~{fragments/status-badge :: statusBadge(${chat.negotiation.stateOfApproval})}"></span></td>
					<td>
						<div class="fw-semibold" th:text="${chat.oviUser.name + ' ' + chat.oviUser.lastName}"></div>
						<div class="text-muted small" th:text="${chat.oviUser.email}"></div>
					</td>
					<td>
						<div class="fw-semibold" th:text="${chat.papPati.name + ' ' + chat.papPati.lastName}"></div>
						<div class="text-muted small" th:text="${chat.papPati.email}"></div>
					</td>
					<td>
						<div class="fw-semibold" th:text="${'#' + chat.request.idRequest + ' · ' + chat.request.description}"></div>
						<div class="text-muted small" th:text="${chat.request.startDate + ' -> ' + chat.request.endDate}"></div>
					</td>
					<td>
						<span class="badge badge-soft text-bg-success" th:if="${chat.contract != null}">Activo</span>
						<span class="text-muted" th:if="${chat.contract == null}">Sin contrato</span>
						<div class="text-muted small" th:if="${chat.contract != null}" th:text="${chat.contract.startDate + ' -> ' + chat.contract.endDate}"></div>
					</td>
					<td th:text="${chat.messageCount}"></td>
					<td>
						<div th:if="${chat.lastMessage != null}">
							<div class="fw-semibold" th:text="${chat.lastMessage.sender + ' · ' + #temporals.format(chat.lastMessage.messageDateTime, 'dd/MM/yyyy')}"></div>
							<div class="text-muted small" th:text="${chat.lastMessage.text}"></div>
						</div>
						<span th:if="${chat.lastMessage == null}" class="text-muted">Sin mensajes</span>
					</td>
					<td th:text="${chat.negotiation.idNegotiation}"></td>
				</tr>
			</tbody>
		</table>
	</div>
</main>
</body>
</html>
