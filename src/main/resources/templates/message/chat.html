<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Chat - SgOVI')}"></head>
<body>
<nav th:replace="~{fragments/topbar :: topbar}"></nav>
<header th:replace="~{fragments/page-header :: pageHeader(title='Chat', icon='bi-chat-dots', subtitle='')}"></header>

<main class="container page-content mb-5">
	<div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
		<span th:text="${successMessage}"></span>
		<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
	</div>
	<div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
		<span th:text="${errorMessage}"></span>
		<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
	</div>

	
    <div th:replace="~{fragments/action-bar :: dashboardBackBar}"></div>

    <div class="card-panel">
		<h2 class="section-title"><i class="bi bi-person-lines-fill" aria-hidden="true"></i> Información del chat</h2>
		<div class="info-grid">
			<div class="info-item">
				<span class="info-label">PAP/PATI</span>
				<span class="info-value" th:text="${chat.papPati.name + ' ' + chat.papPati.lastName}"></span>
				<div class="text-muted small" th:text="${chat.papPati.email}"></div>
			</div>
			<div class="info-item">
				<span class="info-label">Usuario OVI</span>
				<span class="info-value" th:text="${chat.oviUser.name + ' ' + chat.oviUser.lastName}"></span>
				<div class="text-muted small" th:text="${chat.oviUser.email}"></div>
			</div>
			<div class="info-item">
				<span class="info-label">Solicitud origen</span>
				<span class="info-value" th:text="${chat.request.description}"></span>
				<div class="text-muted small" th:text="${chat.request.startDate + ' -> ' + chat.request.endDate}"></div>
			</div>
			<div class="info-item">
				<span class="info-label">Estado de negociación</span>
				<span class="info-value"><span th:replace="~{fragments/status-badge :: statusBadge(${chat.negotiation.stateOfApproval})}"></span></span>
				<div class="text-muted small" th:if="${chat.contract != null}" th:text="${'Contrato: ' + chat.contract.startDate + ' -> ' + chat.contract.endDate}"></div>
			</div>
		</div>
	</div>

	<div class="card-panel">
		<h2 class="section-title"><i class="bi bi-chat-left-text" aria-hidden="true"></i> Mensajes</h2>
		<div th:if="${#lists.isEmpty(messages)}" class="empty-state mb-3">
			<i class="bi bi-chat-square-dots" style="font-size: 2rem;"></i>
			<h5 class="mt-3">Aún no hay mensajes</h5>
			<p class="mb-0 text-muted">Puedes iniciar la conversación escribiendo el primer mensaje.</p>
		</div>

		<div class="message-list mb-4" th:if="${!#lists.isEmpty(messages)}">
			<div th:each="message : ${messages}"
					 class="message-bubble"
					 th:classappend="${message.sender == currentUserLabel} ? ' mine' : ' other'">
				<div class="message-meta">
					<span><strong th:text="${message.sender}"></strong> → <span th:text="${message.receiver}"></span></span>
					<span th:text="${message.messageDateTime}"></span>
				</div>
				<div class="message-text" th:text="${message.text}"></div>
			</div>
		</div>

		<div class="card composer border-0">
			<div class="card-body p-0">
				<form th:action="@{/messages/chat/{idNegotiation}/send(idNegotiation=${chat.negotiation.idNegotiation})}" method="post">
					<div class="mb-3">
						<label for="text" class="form-label fw-semibold">Escribe un mensaje</label>
						<textarea id="text" name="text" class="form-control" placeholder="Escribe aquí tu mensaje..." required maxlength="300"></textarea>
					</div>
					<div class="d-flex gap-2 flex-wrap">
						<button type="submit" class="btn btn-primary"><i class="bi bi-send"></i> Enviar</button>
						<a href="/messages/list" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Volver</a>
					</div>
				</form>
			</div>
		</div>
	</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/sgovi.js}" src="/js/sgovi.js"></script>
</body>
</html>
