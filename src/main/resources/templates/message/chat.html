<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Chat - SgOVI')}"></head>
<body>
<nav th:replace="~{fragments/topbar :: topbar}"></nav>
<header th:replace="~{fragments/page-header :: pageHeader(title='Chat', icon='bi-chat-dots', subtitle='')}"></header>

<main class="container page-content mb-5">
	<div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
		<span th:text="${successMessage}"></span>
		<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
	</div>
	<div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
		<span th:text="${errorMessage}"></span>
		<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
	</div>

	<section class="chat-shell"
			 th:with="counterpartName=${isPapPati ? chat.oviUser.name + ' ' + chat.oviUser.lastName : chat.papPati.name + ' ' + chat.papPati.lastName},
					  counterpartEmail=${isPapPati ? chat.oviUser.email : chat.papPati.email},
					  counterpartRole=${isPapPati ? 'Usuario OVI' : 'PAP/PATI'}">
		<div class="chat-back-row">
			<a th:href="${chatBackUrl}" class="btn btn-outline-secondary">
				<i class="bi bi-arrow-left"></i> Volver
			</a>
		</div>

		<div class="chat-context">
			<div class="chat-context-main">
				<span class="eyebrow-label" th:text="${counterpartRole}">Contacto</span>
				<h2 th:text="${counterpartName}">Contacto</h2>
				<p th:text="${counterpartEmail}">email@example.com</p>
			</div>
			<div class="chat-context-detail">
				<span class="eyebrow-label">Solicitud</span>
				<strong th:text="${chat.request.description}">Solicitud</strong>
				<span th:text="${chat.request.startDate + ' -> ' + chat.request.endDate}">Periodo</span>
			</div>
			<div class="chat-context-status">
				<span th:replace="~{fragments/status-badge :: statusBadge(${chat.negotiation.stateOfApproval})}"></span>
				<span class="text-muted small" th:if="${chat.contract != null}" th:text="${'Contrato: ' + chat.contract.startDate + ' -> ' + chat.contract.endDate}"></span>
				<a th:if="${isOviUser and chat.contract == null and chat.negotiation.stateOfApproval == 'ACCEPTED'}" th:href="@{/contracts/add(negotiationId=${chat.negotiation.idNegotiation})}" class="btn btn-sm btn-primary">
					<i class="bi bi-plus-circle"></i> Crear contrato
				</a>
				<a th:if="${isOviUser and chat.contract != null}" th:href="@{/contracts/edit/{id}(id=${chat.contract.idContract})}" class="btn btn-sm btn-outline-primary">
					<i class="bi bi-pencil-square"></i> Editar contrato
				</a>
			</div>
		</div>

		<div class="chat-thread-title">
			<h2><i class="bi bi-chat-left-text" aria-hidden="true"></i> Mensajes</h2>
		</div>
		<div th:if="${#lists.isEmpty(messages)}" class="empty-state mb-3">
			<i class="bi bi-chat-square-dots" style="font-size: 2rem;"></i>
			<h5 class="mt-3">Aún no hay mensajes</h5>
			<p class="mb-0 text-muted">Puedes iniciar la conversación escribiendo el primer mensaje.</p>
		</div>

		<div class="message-list mb-4" th:if="${!#lists.isEmpty(messages)}">
			<div th:each="message : ${messages}"
					 class="message-bubble"
					 th:with="isOwn=${message.sender == currentUserLabel
					 	|| (isPapPati and (message.sender == papPatiLabel || message.sender == chat.papPati.name))
					 	|| (isOviUser and (message.sender == oviUserLabel || message.sender == chat.oviUser.name))}"
					 th:classappend="${isOwn} ? ' mine' : ' other'">
				<div class="message-meta">
					<span th:text="${isOwn ? 'Tú' : message.sender}">Remitente</span>
					<span th:text="${message.messageDateTime}"></span>
				</div>
				<div class="message-text" th:text="${message.text}"></div>
			</div>
		</div>

		<form class="chat-composer" th:action="@{/messages/chat/{idNegotiation}/send(idNegotiation=${chat.negotiation.idNegotiation})}" method="post">
			<label for="text" class="form-label fw-semibold">Nuevo mensaje</label>
			<textarea id="text" name="text" class="form-control" placeholder="Escribe aquí tu mensaje..." required maxlength="300"></textarea>
			<div class="chat-composer-actions">
				<button type="submit" class="btn btn-primary"><i class="bi bi-send"></i> Enviar</button>
			</div>
		</form>
	</section>
</main>
</body>
</html>
