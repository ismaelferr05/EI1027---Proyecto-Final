<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Actividades - SgOVI')}"></head>
<body>
<nav th:replace="~{fragments/topbar :: topbar}"></nav>
<header th:replace="~{fragments/page-header :: pageHeader(title='Listado de Actividades', icon='bi-calendar-event', subtitle='')}"></header>

<main class="container page-content mb-5">
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill"></i>
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>

    <div class="action-bar">
        <a href="/activities/add" class="action-link btn-primary-custom"><i class="bi bi-plus-circle"></i> Agregar Actividad</a>
    </div>
    <div th:replace="~{fragments/table-tools :: tableTools}" th:if="${tableAction != null}"></div>


    <div class="table-responsive sgovi-table-shell">
        <table class="table table-hover">
            <thead>
                <tr>
                    <th class="table-action-col"><i class="bi bi-tools"></i> Gestión</th>
                    <th><i class="bi bi-blockquote"></i> Nombre</th>
                    <th><i class="bi bi-calendar"></i> Fecha</th>
                    <th><i class="bi bi-tag"></i> Categoría</th>
                    <th><i class="bi bi-person-badge"></i> Formador</th>
                    <th><i class="bi bi-geo-alt"></i> Localización</th>
                    <th><i class="bi bi-clock"></i> Duración</th>
                    <th><i class="bi bi-info-circle"></i> Descripción</th>
                    <th><i class="bi bi-hash"></i> ID</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="activity : ${activities}">
                    <td class="table-action-col">
                        <a th:href="@{/activities/edit/{id}(id=${activity.idActivity})}" class="action-btn btn-view">
                            <i class="bi bi-pencil"></i> Editar
                        </a>
                    </td>
                    <td th:text="${activity.name}"></td>
                    <td th:text="${activity.date}"></td>
                    <td><span class="badge bg-info" th:text="${activity.category}"></span></td>
                    <td th:text="${@nameMaps.trainerNameById(activity.idTrainer)}"></td>
                    <td th:text="${activity.location}"></td>
                    <td th:text="|${activity.duration} min|"></td>
                    <td th:text="${activity.description}"></td>
                    <td th:text="${activity.idActivity}"></td>
                </tr>
            </tbody>
        </table>
    </div>
    <div th:replace="~{fragments/table-tools :: tablePager}" th:if="${tableAction != null}"></div>
</main>
</body>
</html>
