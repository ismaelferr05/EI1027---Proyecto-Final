<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Editar actividad')}"></head>
<body>
<nav th:replace="~{fragments/topbar :: topbar}"></nav>
<header th:replace="~{fragments/page-header :: pageHeader(title='Editar Actividad', icon='bi-pencil-square', subtitle='')}"></header>

<main class="container page-content mb-5">
    
    <div th:replace="~{fragments/action-bar :: dashboardBackBar}"></div>

    <div class="form-section">
        <h2><i class="bi bi-calendar-event" aria-hidden="true"></i> Información General</h2>
        <form th:action="@{/activities/edit}" th:object="${activity}" method="post">
            <input type="hidden" th:field="*{idActivity}" />

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="name" class="form-label">Nombre:</label>
                    <input id="name" type="text" th:field="*{name}" class="form-control" maxlength="100" />
                    <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-danger small mt-2"></div>
                </div>

                <div class="col-md-6 mb-3">
                    <label for="date" class="form-label">Fecha:</label>
                    <input id="date" type="date" th:field="*{date}" class="form-control" />
                    <div th:if="${#fields.hasErrors('date')}" th:errors="*{date}" class="text-danger small mt-2"></div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-4 mb-3">
                    <label for="duration" class="form-label">Duración (minutos):</label>
                    <input id="duration" type="number" th:field="*{duration}" class="form-control" min="1" step="1" />
                    <div th:if="${#fields.hasErrors('duration')}" th:errors="*{duration}" class="text-danger small mt-2"></div>
                </div>

                <div class="col-md-4 mb-3">
                    <label for="location" class="form-label">Localización:</label>
                    <input id="location" type="text" th:field="*{location}" class="form-control" maxlength="150" />
                    <div th:if="${#fields.hasErrors('location')}" th:errors="*{location}" class="text-danger small mt-2"></div>
                </div>

                <div class="col-md-4 mb-3">
                    <label for="category" class="form-label">Categoría:</label>
                    <select id="category" th:field="*{category}" class="form-select">
                        <option value="">Selecciona una categoría</option>
                        <option value="Taller">Taller</option>
                        <option value="Deporte">Deporte</option>
                        <option value="Formación">Formación</option>
                        <option value="Ocio">Ocio</option>
                        <option value="Acompañamiento">Acompañamiento</option>
                    </select>
                    <div th:if="${#fields.hasErrors('category')}" th:errors="*{category}" class="text-danger small mt-2"></div>
                </div>
            </div>

            <div class="mb-3">
                <label for="description" class="form-label">Descripción:</label>
                <textarea id="description" th:field="*{description}" class="form-control" maxlength="1000" rows="4"></textarea>
                <div th:if="${#fields.hasErrors('description')}" th:errors="*{description}" class="text-danger small mt-2"></div>
            </div>

            <div class="mb-3">
                <label for="idTrainer" class="form-label">Formador:</label>
                <select id="idTrainer" th:field="*{idTrainer}" class="form-select">
                    <option value="">Selecciona un formador</option>
                    <option th:each="trainer : ${trainers}" th:value="${trainer.idTrainer}" th:text="|${trainer.name} ${trainer.lastName}|"></option>
                </select>
                <div th:if="${#fields.hasErrors('idTrainer')}" th:errors="*{idTrainer}" class="text-danger small mt-2"></div>
            </div>

            <div class="btn-group-custom">
                <button type="submit" class="btn btn-primary"><i class="bi bi-check-circle"></i> Guardar Cambios</button>
                <a href="/activities/list" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Volver</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
