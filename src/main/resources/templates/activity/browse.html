<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Actividades disponibles')}"></head>
<body>
<nav th:replace="~{fragments/topbar :: topbar}"></nav>
<header th:replace="~{fragments/page-header :: pageHeader(title='Actividades disponibles', icon='bi-calendar-event', subtitle='Inscríbete en las actividades formativas')}"></header>
<main class="container page-content mb-5">
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div th:replace="~{fragments/action-bar :: dashboardBackBar}"></div>

    <div th:if="${#lists.isEmpty(activities)}" class="empty-state">No hay actividades próximas disponibles.</div>

    <div class="table-responsive sgovi-table-shell" th:if="${!#lists.isEmpty(activities)}">
        <table class="table table-striped bg-white">
            <thead>
            <tr>
                <th>Actividad</th>
                <th>Fecha</th>
                <th>Formador</th>
                <th>Localización</th>
                <th>Inscripción</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="activity : ${activities}">
                <td>
                    <strong th:text="${activity.name}"></strong>
                    <div class="text-muted small" th:text="${activity.description}"></div>
                </td>
                <td th:text="${activity.date}"></td>
                <td th:text="${@nameMaps.trainerNameById(activity.idTrainer)}"></td>
                <td th:text="${activity.location}"></td>
                <td>
                    <span class="badge text-bg-success" th:if="${enrolledByActivityId[activity.idActivity]}">Inscrito</span>
                    <form th:unless="${enrolledByActivityId[activity.idActivity]}" th:action="@{/activities/{id}/signup(id=${activity.idActivity})}" method="post">
                        <button type="submit" class="btn btn-sm btn-primary">Inscribirse</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
