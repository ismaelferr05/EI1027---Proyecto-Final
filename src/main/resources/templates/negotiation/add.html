<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Crear negociación')}"></head>
<body>
<nav th:replace="~{fragments/topbar :: topbar}"></nav>
<header th:replace="~{fragments/page-header :: pageHeader(title='Nueva Negociación', icon='bi-plus-circle', subtitle='')}"></header>

<main class="container page-content mb-5">
    
    <div th:replace="~{fragments/action-bar :: dashboardBackBar}"></div>

    <div class="form-section">
        <form class="form-horizontal" th:action="@{/negotiations/add}" th:object="${negotiation}" method="post">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="stateOfApproval" class="form-label">Estado:</label>
                    <select id="stateOfApproval" th:field="*{stateOfApproval}" class="form-select">
                        <option value="">Selecciona un estado</option>
                        <option value="PENDING">PENDING</option>
                        <option value="ACCEPTED">ACCEPTED</option>
                        <option value="IN_PROGRESS">IN_PROGRESS</option>
                        <option value="REJECTED">REJECTED</option>
                        <option value="CANCELLED">CANCELLED</option>
                    </select>
                    <div th:if="${#fields.hasErrors('stateOfApproval')}" th:errors="*{stateOfApproval}" class="text-danger small mt-2"></div>
                </div>

                <div class="col-md-6 mb-3">
                    <label for="idRequest" class="form-label">Solicitud:</label>
                    <select id="idRequest" th:field="*{idRequest}" class="form-select">
                        <option value="">Selecciona una solicitud</option>
                        <option th:each="request : ${requests}" th:value="${request.idRequest}" th:text="|${request.idRequest} - ${request.training}|"></option>
                    </select>
                    <div th:if="${#fields.hasErrors('idRequest')}" th:errors="*{idRequest}" class="text-danger small mt-2"></div>
                </div>
            </div>

            <div class="mb-3">
                <label for="idPapPati" class="form-label">PAP PATI:</label>
                <select id="idPapPati" th:field="*{idPapPati}" class="form-select">
                    <option value="">Selecciona un PAP PATI</option>
                    <option th:each="papPati : ${papPatis}" th:value="${papPati.idPapPati}" th:text="|${papPati.name} ${papPati.lastName}|"></option>
                </select>
                <div th:if="${#fields.hasErrors('idPapPati')}" th:errors="*{idPapPati}" class="text-danger small mt-2"></div>
            </div>

            <div class="btn-group-custom">
                <button type="submit" class="btn btn-primary"><i class="bi bi-check-circle"></i> Guardar Negociación</button>
                <a href="/negotiations/list" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Volver</a>
            </div>
        </form>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/sgovi.js}" src="/js/sgovi.js"></script>
</body>
</html>
