<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Negociaciones - SgOVI')}"></head>
<body>
<nav th:replace="~{fragments/topbar :: topbar}"></nav>
<header th:replace="~{fragments/page-header :: pageHeader(title='Listado de Negociaciones', icon='bi-arrow-left-right', subtitle='')}"></header>

<main class="container page-content mb-5">
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill"></i>
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>

    <div class="action-bar">
        <a href="/negotiations/add" class="action-link btn-primary-custom"><i class="bi bi-plus-circle"></i> Agregar Negociación</a>
    </div>
    <div th:replace="~{fragments/table-tools :: tableTools}" th:if="${tableAction != null}"></div>


    <div class="table-responsive sgovi-table-shell">
    <table class="table table-hover">
        <thead>
            <tr>
                <th class="table-action-col"><i class="bi bi-tools"></i> Gestión</th>
                <th><i class="bi bi-people"></i> Usuario OVI</th>
                <th><i class="bi bi-person-arms-up"></i> PAP/PATI</th>
                <th><i class="bi bi-file-text"></i> Solicitud</th>
                <th><i class="bi bi-check-circle"></i> Estado</th>
                <th><i class="bi bi-hash"></i> ID</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="negotiation : ${negotiations}"
                th:with="req=${@nameMaps.requestById(negotiation.idRequest)}">
                <td class="table-action-col">
                    <a th:href="@{/messages/negotiation/{id}(id=${negotiation.idNegotiation})}" class="action-btn btn-view">
                        <i class="bi bi-chat-dots"></i> Abrir
                    </a>
                </td>
                <td th:text="${req != null ? @nameMaps.oviUserNameById(req.idOviUser) : '—'}">Usuario OVI</td>
                <td th:text="${@nameMaps.papPatiNameById(negotiation.idPapPati)}">PAP/PATI</td>
                <td>
                    <span th:text="|#${negotiation.idRequest}|">#1</span>
                    <div class="text-muted small" th:if="${req != null}" th:text="${req.description}"></div>
                </td>
                <td><span th:replace="~{fragments/status-badge :: statusBadge(${negotiation.stateOfApproval})}"></span></td>
                <td th:text="${negotiation.idNegotiation}"></td>
            </tr>
        </tbody>
    </table>
    </div>
    <div th:replace="~{fragments/table-tools :: tablePager}" th:if="${tableAction != null}"></div>
</main>
</body>
</html>
