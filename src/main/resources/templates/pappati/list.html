<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('PAP PATI - SgOVI')}"></head>
<body>
<nav th:replace="~{fragments/topbar :: topbar}"></nav>
<header th:replace="~{fragments/page-header :: pageHeader(title='Listado de PAP PATI', icon='bi-person-arms-up', subtitle='')}"></header>

<main class="container page-content mb-5">
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill"></i>
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>

    <div class="action-bar">
        <a href="/dashboard" class="action-link btn-outline-custom"><i class="bi bi-house"></i> Volver al dashboard</a>
        <a href="/pap-patis/add" class="action-link btn-primary-custom"><i class="bi bi-plus-circle"></i> Agregar PAP PATI</a>
    </div>
    <div th:replace="~{fragments/table-tools :: tableTools}" th:if="${tableAction != null}"></div>


    <div class="table-responsive">
        <table class="table table-hover">
            <thead>
                <tr>
                    <th><i class="bi bi-hash"></i> ID</th>
                    <th><i class="bi bi-person"></i> Nombre</th>
                    <th><i class="bi bi-person"></i> Apellidos</th>
                    <th><i class="bi bi-envelope"></i> Email</th>
                    <th><i class="bi bi-telephone"></i> Teléfono</th>
                    <th><i class="bi bi-geo-alt"></i> Provincia</th>
                    <th><i class="bi bi-building"></i> Ciudad</th>
                    <th><i class="bi bi-mailbox"></i> CP</th>
                    <th><i class="bi bi-cake2"></i> Edad</th>
                    <th><i class="bi bi-person-fill"></i> Género</th>
                    <th><i class="bi bi-book"></i> Formación</th>
                    <th><i class="bi bi-briefcase"></i> Experiencia</th>
                    <th><i class="bi bi-check-circle"></i> Estado</th>
                    <th><i class="bi bi-tools"></i> Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="papPati : ${papPatis}">
                    <td th:text="${papPati.idPapPati}"></td>
                    <td th:text="${papPati.name}"></td>
                    <td th:text="${papPati.lastName}"></td>
                    <td th:text="${papPati.email}"></td>
                    <td th:text="${papPati.phone}"></td>
                    <td th:text="${papPati.province}"></td>
                    <td th:text="${papPati.town}"></td>
                    <td th:text="${papPati.pc}"></td>
                    <td th:text="${papPati.age}"></td>
                    <td th:text="${papPati.gender}"></td>
                    <td th:text="${papPati.training}"></td>
                    <td th:text="${papPati.experience}"></td>
                    <td><span th:replace="~{fragments/status-badge :: statusBadge(${papPati.status})}"></span></td>
                    <td>
                        <a th:href="@{/pap-patis/view/{id}(id=${papPati.idPapPati})}" class="action-btn btn-edit" aria-label="Ver perfil"><i class="bi bi-eye" aria-hidden="true"></i></a>
                        <a th:href="@{/pap-patis/edit/{id}(id=${papPati.idPapPati})}" class="action-btn btn-edit" aria-label="Editar"><i class="bi bi-pencil" aria-hidden="true"></i></a>
                        <form th:if="${papPati.status == 'PENDING'}" th:action="@{/pap-patis/accept}" method="post" style="display:inline-block;">
                            <input type="hidden" name="idPapPati" th:value="${papPati.idPapPati}">
                            <button type="submit" class="action-btn btn-edit" aria-label="Aceptar"><i class="bi bi-check" aria-hidden="true"></i></button>
                        </form>
                        <form th:if="${papPati.status != 'REJECTED'}" th:action="@{/pap-patis/reject}" method="post" style="display:inline-block;">
                            <input type="hidden" name="idPapPati" th:value="${papPati.idPapPati}">
                            <input type="text" name="reason" th:id="|reject-reason-${papPati.idPapPati}|" aria-label="Motivo del rechazo" placeholder="Motivo" required class="form-control form-control-sm d-inline-block" style="width:120px;">
                            <button type="submit" class="action-btn btn-delete" aria-label="Rechazar"><i class="bi bi-x" aria-hidden="true"></i></button>
                        </form>
                        <a th:href="@{/pap-patis/delete/{id}(id=${papPati.idPapPati})}" class="action-btn btn-delete" aria-label="Eliminar"><i class="bi bi-trash" aria-hidden="true"></i></a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
