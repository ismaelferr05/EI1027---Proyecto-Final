<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('PAP/PATI')}"></head>
<body>
<nav th:replace="~{fragments/topbar :: topbar}"></nav>
<header th:replace="~{fragments/page-header :: pageHeader(title=|PAP/PATI: ${papPati.name} ${papPati.lastName}|, icon='bi-person-arms-up', subtitle='')}"></header>
<main class="container page-content mb-5">
    
    <div th:replace="~{fragments/action-bar :: dashboardBackBar}"></div>

    <div class="bg-white p-4 rounded shadow-sm mb-4">
        <p><strong>Email:</strong> <span th:text="${papPati.email}"></span></p>
        <p><strong>Estado:</strong> <span th:replace="~{fragments/status-badge :: statusBadge(${papPati.status})}"></span></p>
        <p th:if="${papPati.status == 'REJECTED'}"><strong>Motivo rechazo:</strong> <span th:text="${papPati.rejectionReason}"></span></p>
    </div>
    <h2>Contratos</h2>
    <div class="table-responsive sgovi-table-shell">
    <table class="table table-striped bg-white">
        <thead><tr><th>ID</th><th>Inicio</th><th>Fin</th><th>Estado</th><th>Documento</th></tr></thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(contracts)}"><td colspan="5">No hay contratos asociados.</td></tr>
        <tr th:each="contract : ${contracts}">
            <td th:text="${contract.idContract}"></td>
            <td th:text="${contract.startDate}"></td>
            <td th:text="${contract.endDate}"></td>
            <td th:with="contractStatus=${contract.endDate.isBefore(T(java.time.LocalDate).now()) ? 'FINALIZADO' : 'ACTIVO'}">
                <span th:replace="~{fragments/status-badge :: statusBadge(${contractStatus})}"></span>
            </td>
            <td><a th:href="@{/contracts/document/{id}(id=${contract.idContract})}" target="_blank" rel="noopener noreferrer">Ver documento</a></td>
        </tr>
        </tbody>
    </table>
    </div>
    <a href="/pap-patis/list" class="btn btn-outline-secondary">Volver</a>
</main>
<script th:src="@{/js/sgovi.js}" src="/js/sgovi.js"></script>
</body>
</html>
