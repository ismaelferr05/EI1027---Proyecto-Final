<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PAP/PATI</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"></head>
<body class="bg-light">
<main class="container py-5">
    <h1 th:text="|PAP/PATI: ${papPati.name} ${papPati.lastName}|"></h1>
    <div class="bg-white p-4 rounded shadow-sm mb-4">
        <p><strong>Email:</strong> <span th:text="${papPati.email}"></span></p>
        <p><strong>Estado:</strong> <span class="badge bg-secondary" th:text="${papPati.status}"></span></p>
        <p th:if="${papPati.status == 'REJECTED'}"><strong>Motivo rechazo:</strong> <span th:text="${papPati.rejectionReason}"></span></p>
    </div>
    <h2>Contratos</h2>
    <table class="table table-striped bg-white">
        <thead><tr><th>ID</th><th>Inicio</th><th>Fin</th><th>Estado</th><th>Documento</th></tr></thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(contracts)}"><td colspan="5">No hay contratos asociados.</td></tr>
        <tr th:each="contract : ${contracts}">
            <td th:text="${contract.idContract}"></td>
            <td th:text="${contract.startDate}"></td>
            <td th:text="${contract.endDate}"></td>
            <td th:text="${contract.endDate.isBefore(T(java.time.LocalDate).now()) ? 'FINALIZADO' : 'ACTIVO'}"></td>
            <td><a th:href="${contract.url}" target="_blank">Ver</a></td>
        </tr>
        </tbody>
    </table>
    <a href="/pap-patis/list" class="btn btn-outline-secondary">Volver</a>
</main>
</body>
</html>
