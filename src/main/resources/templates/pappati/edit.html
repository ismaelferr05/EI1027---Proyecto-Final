<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Editar PAP PATI')}"></head>
<body>
<nav th:replace="~{fragments/topbar :: topbar}"></nav>
<header th:replace="~{fragments/page-header :: pageHeader(title='Editar PAP PATI', icon='bi-pencil-square', subtitle='')}"></header>

<main class="container page-content mb-5">
    
    <div th:replace="~{fragments/action-bar :: dashboardBackBar}"></div>

    <div class="form-section">
        <form th:action="${selfProfile} ? @{/pap-patis/profile} : @{/pap-patis/edit}" th:object="${papPati}" method="post">
            <input type="hidden" th:field="*{idPapPati}" />

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="name" class="form-label">Nombre:</label>
                    <input id="name" type="text" th:field="*{name}" class="form-control" maxlength="50" />
                    <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-danger small mt-2"></div>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="lastName" class="form-label">Apellidos:</label>
                    <input id="lastName" type="text" th:field="*{lastName}" class="form-control" maxlength="50" />
                    <div th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}" class="text-danger small mt-2"></div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="email" class="form-label">Email:</label>
                    <input id="email" type="email" th:field="*{email}" class="form-control" maxlength="100" />
                    <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-danger small mt-2"></div>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="phone" class="form-label">Teléfono:</label>
                    <input id="phone" type="text" th:field="*{phone}" class="form-control" maxlength="20" />
                    <div th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="text-danger small mt-2"></div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="password" class="form-label">Contraseña:</label>
                    <input id="password" type="password" th:field="*{password}" class="form-control" maxlength="255" />
                    <div class="form-text">Déjala vacía para mantener la contraseña actual.</div>
                    <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-danger small mt-2"></div>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="province" class="form-label">Provincia:</label>
                    <input id="province" type="text" th:field="*{province}" class="form-control" maxlength="50" />
                    <div th:if="${#fields.hasErrors('province')}" th:errors="*{province}" class="text-danger small mt-2"></div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-4 mb-3">
                    <label for="town" class="form-label">Población:</label>
                    <input id="town" type="text" th:field="*{town}" class="form-control" maxlength="50" />
                    <div th:if="${#fields.hasErrors('town')}" th:errors="*{town}" class="text-danger small mt-2"></div>
                </div>
                <div class="col-md-4 mb-3">
                    <label for="pc" class="form-label">Código postal:</label>
                    <input id="pc" type="text" th:field="*{pc}" class="form-control" maxlength="10" />
                    <div th:if="${#fields.hasErrors('pc')}" th:errors="*{pc}" class="text-danger small mt-2"></div>
                </div>
                <div class="col-md-4 mb-3">
                    <label for="age" class="form-label">Edad:</label>
                    <input id="age" type="number" th:field="*{age}" class="form-control" min="0" step="1" />
                    <div th:if="${#fields.hasErrors('age')}" th:errors="*{age}" class="text-danger small mt-2"></div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-4 mb-3">
                    <label for="gender" class="form-label">Género:</label>
                    <select id="gender" th:field="*{gender}" class="form-select">
                        <option value="">Selecciona un género</option>
                        <option value="Masculino">Masculino</option>
                        <option value="Femenino">Femenino</option>
                        <option value="Otro">Otro</option>
                    </select>
                    <div th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}" class="text-danger small mt-2"></div>
                </div>
                <div class="col-md-4 mb-3">
                    <label for="cvUrl" class="form-label">URL CV:</label>
                    <input id="cvUrl" type="url" th:field="*{cvUrl}" class="form-control" maxlength="255" />
                    <div th:if="${#fields.hasErrors('cvUrl')}" th:errors="*{cvUrl}" class="text-danger small mt-2"></div>
                </div>
                <div class="col-md-4 mb-3">
                    <label for="status" class="form-label">Estado:</label>
                    <select id="status" th:field="*{status}" class="form-select" th:disabled="${selfProfile}">
                        <option value="">Selecciona un estado</option>
                        <option value="PENDING">PENDING</option>
                        <option value="ACCEPTED">ACCEPTED</option>
                        <option value="REJECTED">REJECTED</option>
                    </select>
                    <div th:if="${#fields.hasErrors('status')}" th:errors="*{status}" class="text-danger small mt-2"></div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-4 mb-3">
                    <label for="training" class="form-label">Formación:</label>
                    <input id="training" type="text" th:field="*{training}" class="form-control" maxlength="100" />
                    <div th:if="${#fields.hasErrors('training')}" th:errors="*{training}" class="text-danger small mt-2"></div>
                </div>
                <div class="col-md-4 mb-3">
                    <label for="experience" class="form-label">Experiencia:</label>
                    <input id="experience" type="text" th:field="*{experience}" class="form-control" maxlength="50" />
                    <div th:if="${#fields.hasErrors('experience')}" th:errors="*{experience}" class="text-danger small mt-2"></div>
                </div>
                <div class="col-md-4 mb-3">
                    <label for="experienceType" class="form-label">Tipo experiencia:</label>
                    <input id="experienceType" type="text" th:field="*{experienceType}" class="form-control" maxlength="50" />
                    <div th:if="${#fields.hasErrors('experienceType')}" th:errors="*{experienceType}" class="text-danger small mt-2"></div>
                </div>
            </div>

            <div class="btn-group-custom">
                <button type="submit" class="btn btn-primary"><i class="bi bi-check-circle"></i> Guardar cambios</button>
                <a th:href="${selfProfile} ? @{/dashboard} : @{/pap-patis/list}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Volver</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
