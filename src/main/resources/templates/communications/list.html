<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Comunicaciones')}"></head>
<body>
<nav th:replace="~{fragments/topbar :: topbar}"></nav>
<header th:replace="~{fragments/page-header :: pageHeader(title='Comunicaciones con técnico OVI', icon='bi-envelope-paper', subtitle='')}"></header>
<main class="container page-content mb-5">
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div th:replace="~{fragments/action-bar :: dashboardBackBar}"></div>

    <form th:action="@{/communications/send}" th:object="${communication}" method="post" class="bg-white p-4 rounded shadow-sm mb-4">
        <div class="row g-3">
            <div class="col-md-4" th:if="${isTechnician}">
                <label class="form-label">Tipo destinatario</label>
                <select th:field="*{recipientType}" class="form-select">
                    <option value="OVIUSER">Usuario OVI</option>
                    <option value="PAPPATI">PAP/PATI</option>
                </select>
            </div>
            <div class="col-md-4" th:if="${isTechnician}">
                <label class="form-label">ID destinatario</label>
                <input th:field="*{recipientId}" type="number" class="form-control" required>
            </div>
            <div class="col-md-8">
                <label class="form-label">Asunto</label>
                <input th:field="*{subject}" class="form-control" maxlength="120" required>
            </div>
            <div class="col-12">
                <label class="form-label">Texto</label>
                <textarea th:field="*{text}" class="form-control" rows="3" required></textarea>
            </div>
        </div>
        <button class="btn btn-primary mt-3">Registrar comunicación</button>
    </form>

    <div class="table-responsive sgovi-table-shell">
        <table class="table table-striped bg-white">
            <thead><tr><th>Fecha</th><th>Emisor</th><th>Destinatario</th><th>Asunto</th><th>Texto</th></tr></thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(communications)}"><td colspan="5">No hay comunicaciones registradas.</td></tr>
            <tr th:each="item : ${communications}">
                <td th:text="${item.communicationDateTime}"></td>
                <td th:text="${@nameMaps.roleLabel(item.senderRole)}"></td>
                <td th:text="${@nameMaps.recipientLabel(item.recipientType, item.recipientId)}"></td>
                <td th:text="${item.subject}"></td>
                <td th:text="${item.text}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<script th:src="@{/js/sgovi.js}" src="/js/sgovi.js"></script>
</body>
</html>
