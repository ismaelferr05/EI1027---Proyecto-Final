<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Comunicaciones')}"></head>
<body>
<nav th:replace="~{fragments/topbar :: topbar}"></nav>
<header th:replace="~{fragments/page-header :: pageHeader(title='Comunicaciones con técnico OVI', icon='bi-envelope-paper', subtitle='Usuarios y Pappati')}"></header>
<main class="container page-content mb-5">
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div th:replace="~{fragments/action-bar :: dashboardBackBar}"></div>

    <form th:if="${!isTechnician}" th:action="@{/communications/send}" th:object="${communication}" method="post" class="bg-white p-4 rounded shadow-sm mb-4">
        <div class="row g-3">
            <div class="col-md-8">
                <label for="subject" class="form-label">Asunto</label>
                <input id="subject" th:field="*{subject}" class="form-control" maxlength="120" required>
            </div>
            <div class="col-12">
                <label for="text" class="form-label">Texto</label>
                <textarea id="text" th:field="*{text}" class="form-control" rows="3" required></textarea>
            </div>
        </div>
        <button class="btn btn-primary mt-3">Registrar comunicación</button>
    </form>

    <div th:if="${isTechnician}" class="communication-compose-grid mb-4">
        <div>
            <form th:action="@{/communications/send}" th:object="${communication}" method="post" class="bg-white p-4 rounded shadow-sm h-100">
                <input type="hidden" name="recipientType" value="OVIUSER">
                <div class="row g-3">
                    <div class="col-12">
                        <label for="recipientIdOvi" class="form-label">Usuario OVI destinatario</label>
                        <select id="recipientIdOvi" name="recipientId" class="form-select" required>
                            <option value="">Selecciona un usuario OVI</option>
                            <option th:each="u : ${oviUsers}" th:value="${u.idOviUser}"
                                    th:text="${u.name + ' ' + u.lastName}"></option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label for="subjectOvi" class="form-label">Asunto</label>
                        <input id="subjectOvi" name="subject" class="form-control" maxlength="120" required>
                    </div>
                    <div class="col-12">
                        <label for="textOvi" class="form-label">Texto</label>
                        <textarea id="textOvi" name="text" class="form-control" rows="3" required></textarea>
                    </div>
                </div>
                <button class="btn btn-primary mt-3">Enviar a usuario OVI</button>
            </form>
        </div>

        <div>
            <form th:action="@{/communications/send}" th:object="${communication}" method="post" class="bg-white p-4 rounded shadow-sm h-100">
                <input type="hidden" name="recipientType" value="PAPPATI">
                <div class="row g-3">
                    <div class="col-12">
                        <label for="recipientIdPap" class="form-label">PAP/PATI destinatario</label>
                        <select id="recipientIdPap" name="recipientId" class="form-select" required>
                            <option value="">Selecciona un PAP/PATI</option>
                            <option th:each="p : ${papPatis}" th:value="${p.idPapPati}"
                                    th:text="${p.name + ' ' + p.lastName}"></option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label for="subjectPap" class="form-label">Asunto</label>
                        <input id="subjectPap" name="subject" class="form-control" maxlength="120" required>
                    </div>
                    <div class="col-12">
                        <label for="textPap" class="form-label">Texto</label>
                        <textarea id="textPap" name="text" class="form-control" rows="3" required></textarea>
                    </div>
                </div>
                <button class="btn btn-primary mt-3">Enviar a PAP/PATI</button>
            </form>
        </div>
    </div>
    <div class="table-responsive sgovi-table-shell">
        <table class="table table-striped bg-white">
            <thead>
                <tr>
                    <th>Asunto y texto</th>
                    <th>Destinatario</th>
                    <th>Emisor</th>
                    <th>Fecha</th>
                </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(communications)}"><td colspan="4">No hay comunicaciones registradas.</td></tr>
            <tr th:each="item : ${communications}">
                <td>
                    <strong th:text="${item.subject}"></strong>
                    <div class="text-muted small mt-1" th:text="${item.text.length() > 120} ? ${item.text.substring(0,120) + '...'} : ${item.text}"></div>
                    <details class="mt-2">
                        <summary class="small">Ver texto completo</summary>
                        <div class="mt-2" th:utext="${#strings.escapeXml(item.text).replaceAll('\n','<br/>')}"></div>
                    </details>
                </td>
                <td th:text="${@nameMaps.recipientLabel(item.recipientType, item.recipientId)}"></td>
                <td th:text="${@nameMaps.roleLabel(item.senderRole)}"></td>
                <td th:text="${item.communicationDateTime}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
