<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Formadores - SgOVI')}"></head>
<body>
<nav th:replace="~{fragments/topbar :: topbar}"></nav>
<header th:replace="~{fragments/page-header :: pageHeader(title='Listado de Formadores', icon='bi-person-badge', subtitle='')}"></header>

<main class="container page-content mb-5">
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill"></i>
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>

    <div class="action-bar">
        <a href="/trainers/add" class="action-link btn-primary-custom"><i class="bi bi-plus-circle"></i> Agregar Formador</a>
    </div>
    <div th:replace="~{fragments/table-tools :: tableTools}" th:if="${tableAction != null}"></div>


    <div class="table-responsive sgovi-table-shell">
    <table class="table table-hover">
        <thead>
            <tr>
                <th class="table-action-col"><i class="bi bi-tools"></i> Gestión</th>
                <th><i class="bi bi-person"></i> Formador</th>
                <th><i class="bi bi-briefcase"></i> Ocupación</th>
                <th><i class="bi bi-envelope"></i> Email</th>
                <th><i class="bi bi-telephone"></i> Teléfono</th>
                <th><i class="bi bi-geo-alt"></i> Dirección</th>
                <th><i class="bi bi-hash"></i> ID</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="trainer : ${trainers}">
                <td class="table-action-col">
                    <a th:href="@{/trainers/edit/{id}(id=${trainer.idTrainer})}" class="action-btn btn-view">
                        <i class="bi bi-pencil"></i> Editar
                    </a>
                </td>
                <td>
                    <strong th:text="${trainer.name + ' ' + trainer.lastName}"></strong>
                </td>
                <td th:text="${trainer.occupation}"></td>
                <td th:text="${trainer.email}"></td>
                <td th:text="${trainer.phone}"></td>
                <td th:text="${trainer.address}"></td>
                <td th:text="${trainer.idTrainer}"></td>
            </tr>
        </tbody>
    </table>
    </div>
    <div th:replace="~{fragments/table-tools :: tablePager}" th:if="${tableAction != null}"></div>
</main>
</body>
</html>
