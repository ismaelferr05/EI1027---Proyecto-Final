<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Editar formador')}"></head>
<body>
<nav th:replace="~{fragments/topbar :: topbar}"></nav>
<header th:replace="~{fragments/page-header :: pageHeader(title='Editar Formador', icon='bi-pencil-square', subtitle='')}"></header>

<main class="container page-content mb-5">
    
    <div th:replace="~{fragments/action-bar :: dashboardBackBar}"></div>

    <div class="form-section">
        <form th:action="@{/trainers/edit}" th:object="${trainer}" method="post">
            <input type="hidden" th:field="*{idTrainer}" />

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="name" class="form-label">Nombre:</label>
                    <input id="name" type="text" th:field="*{name}" class="form-control" maxlength="50" />
                    <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-danger small mt-2"></div>
                </div>

                <div class="col-md-6 mb-3">
                    <label for="lastName" class="form-label">Apellidos:</label>
                    <input id="lastName" type="text" th:field="*{lastName}" class="form-control" maxlength="50" />
                    <div th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}" class="text-danger small mt-2"></div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="occupation" class="form-label">Ocupación:</label>
                    <input id="occupation" type="text" th:field="*{occupation}" class="form-control" maxlength="100" />
                    <div th:if="${#fields.hasErrors('occupation')}" th:errors="*{occupation}" class="text-danger small mt-2"></div>
                </div>

                <div class="col-md-6 mb-3">
                    <label for="email" class="form-label">Email:</label>
                    <input id="email" type="email" th:field="*{email}" class="form-control" maxlength="100" />
                    <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-danger small mt-2"></div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="phone" class="form-label">Teléfono:</label>
                    <input id="phone" type="text" th:field="*{phone}" class="form-control" maxlength="20" />
                    <div th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="text-danger small mt-2"></div>
                </div>

                <div class="col-md-6 mb-3">
                    <label for="address" class="form-label">Dirección:</label>
                    <input id="address" type="text" th:field="*{address}" class="form-control" maxlength="150" />
                    <div th:if="${#fields.hasErrors('address')}" th:errors="*{address}" class="text-danger small mt-2"></div>
                </div>
            </div>

            <div class="btn-group-custom">
                <button type="submit" class="btn btn-primary"><i class="bi bi-check-circle"></i> Guardar Cambios</button>
                <a href="/trainers/list" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Volver</a>
            </div>
        </form>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/sgovi.js}" src="/js/sgovi.js"></script>
</body>
</html>
