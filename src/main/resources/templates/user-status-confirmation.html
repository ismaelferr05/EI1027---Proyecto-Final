<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Confirmación')}"></head>
<body>
<nav th:replace="~{fragments/topbar :: topbar}"></nav>
<header th:replace="~{fragments/page-header :: pageHeader(title='Confirmación', icon='bi-envelope-check', subtitle='')}"></header>
<main class="container page-content mb-5">
    
    <div th:replace="~{fragments/action-bar :: dashboardBackBar}"></div>

    <div class="alert alert-success">
        Acción aplicada sobre <strong th:text="${entityName}"></strong>.
    </div>
    <div class="bg-white p-4 rounded shadow-sm">
        <h2>Email generado</h2>
        <p><strong>Para:</strong> <span th:text="${email.to}"></span></p>
        <p><strong>Asunto:</strong> <span th:text="${email.subject}"></span></p>
        <pre th:text="${email.body}"></pre>
    </div>
</main>
<script th:src="@{/js/sgovi.js}" src="/js/sgovi.js"></script>
</body>
</html>
